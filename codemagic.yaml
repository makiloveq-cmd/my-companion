workflows:
  ios-workflow:
    name: Rifugio iOS Build (Unsigned)
    max_build_duration: 60
    environment:
      node: 20.0.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/assets --save-dev
      - name: Add iOS platform
        script: |
          npx cap add ios || true
      - name: Generate icons
        script: |
          npx capacitor-assets generate \
            --assetPath assets \
            --iconBackgroundColor '#04080f' \
            --iconBackgroundColorDark '#04080f' \
            --splashBackgroundColor '#04080f' \
            --splashBackgroundColorDark '#04080f' \
            --ios || true
          ls -la assets/
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          mkdir -p build/ipa
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../../build/ipa/Rifugio.ipa Payload
    artifacts:
      - build/ipa/Rifugio.ipa
    publishing:
      email:
        recipients:
          - makiloveq@gmail.com
        notify:
          success: true
          failure: true
