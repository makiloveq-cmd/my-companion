<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>聊天 - Rifugio</title>
<link rel="stylesheet" href="/theme.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
.header {
  padding: max(18px, env(safe-area-inset-top)) 20px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 20px; font-weight: 500; }
.header-usage {
  font-size: 13px; color: var(--text-3);
  text-decoration: none;
  display: flex; align-items: center; gap: 4px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 14px;
}
.list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.chat-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  text-decoration: none;
  color: inherit;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.chat-item:active { background: var(--surface2); }
.chat-avatar {
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 500; flex-shrink: 0;
  overflow: hidden;
}
.chat-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.chat-avatar.space { background: var(--surface3); color: var(--text-2); }
.chat-info {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 4px;
}
.chat-name { font-size: 16px; font-weight: 500; color: var(--text); }
.chat-preview {
  font-size: 13px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 6px; flex-shrink: 0;
}
.chat-time { font-size: 11px; color: var(--text-3); }
.tab-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 10px 0 max(16px, env(safe-area-inset-bottom));
}
.tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  text-decoration: none; color: var(--text-3); font-size: 10px;
}
.tab.active { color: var(--accent); }
.tab-icon { font-size: 20px; }
</style>
</head>
<body>
<div class="header">
  <h1>聊天</h1>
  <a class="header-usage" href="/usage_page">⚡ 用量</a>
</div>
<div class="list" id="list"></div>
<div class="tab-bar">
  <a class="tab" href="/"><div class="tab-icon">⌂</div><div>首頁</div></a>
  <a class="tab active" href="/chatlist_page"><div class="tab-icon">✦</div><div>聊天</div></a>
  <a class="tab" href="#"><div class="tab-icon">◎</div><div>朋友圈</div></a>
  <a class="tab" href="/diary_page"><div class="tab-icon">✐</div><div>日記</div></a>
  <a class="tab" href="/persona_page"><div class="tab-icon">⋯</div><div>人物書</div></a>
</div>
<script>
function formatChatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const tw = new Date(d.getTime() + 8 * 60 * 60 * 1000);
  const nowTw = new Date(Date.now() + 8 * 60 * 60 * 1000);
  const isToday = tw.getUTCFullYear() === nowTw.getUTCFullYear()
               && tw.getUTCMonth() === nowTw.getUTCMonth()
               && tw.getUTCDate() === nowTw.getUTCDate();
  if (isToday) return `${String(tw.getUTCHours()).padStart(2,'0')}:${String(tw.getUTCMinutes()).padStart(2,'0')}`;
  return `${tw.getUTCMonth()+1}/${tw.getUTCDate()}`;
}

async function loadAvatars() {
  try {
    const res = await fetch('/personas');
    const data = await res.json();
    return { claude: data.claude?.avatar || null };
  } catch(e) { return {}; }
}

function makeAvatar(cls, initial, avatarSrc) {
  const div = document.createElement('div');
  div.className = `chat-avatar ${cls}`;
  if (avatarSrc && avatarSrc.startsWith('data:')) {
    const img = document.createElement('img');
    img.src = avatarSrc;
    div.appendChild(img);
  } else {
    div.textContent = initial;
  }
  return div;
}

async function loadChatList() {
  const avatars = await loadAvatars();
  try {
    const res = await fetch('/chat_list');
    const data = await res.json();
    const list = document.getElementById('list');
    list.innerHTML = '';
    const items = [
      { href: '/chatroom', name: data.claude.name, preview: data.claude.preview, time: data.claude.time, avatarCls: '', initial: data.claude.name[0], avatarSrc: avatars.claude },
      { href: '/space_page', name: '共同空間', preview: '進入你們的空間…', time: null, avatarCls: 'space', initial: '◈', avatarSrc: null },
    ];
    items.forEach(item => {
      const a = document.createElement('a');
      a.className = 'chat-item';
      a.href = item.href;
      const avatar = makeAvatar(item.avatarCls, item.initial, item.avatarSrc);
      const info = document.createElement('div');
      info.className = 'chat-info';
      const name = document.createElement('div');
      name.className = 'chat-name';
      name.textContent = item.name;
      const preview = document.createElement('div');
      preview.className = 'chat-preview';
      preview.textContent = item.preview;
      info.appendChild(name);
      info.appendChild(preview);
      const right = document.createElement('div');
      right.className = 'chat-right';
      const time = document.createElement('div');
      time.className = 'chat-time';
      time.textContent = formatChatTime(item.time);
      right.appendChild(time);
      a.appendChild(avatar);
      a.appendChild(info);
      a.appendChild(right);
      list.appendChild(a);
    });
  } catch(e) {}
}

loadChatList();
</script>
<script src="/theme.js"></script>
</body>
</html>
