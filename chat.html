<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的陪伴空間</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px 20px;
            background: #16213e;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 { font-size: 18px; font-weight: 400; }
        .ai-switch {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .ai-btn {
            padding: 6px 14px;
            border: 1px solid #0f3460;
            background: transparent;
            color: #aaa;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .ai-btn.active {
            background: #0f3460;
            color: #fff;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .message-row.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s;
        }
        .avatar:active { opacity: 0.7; }
        .avatar.user {
            background: #3a5a8a;
            color: #fff;
        }
        .avatar.ai {
            background: #2a3a5a;
            color: #ccc;
        }
        .message-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }
        .message-row.user .message-block {
            align-items: flex-end;
        }
        .message-name {
            font-size: 12px;
            color: #888;
            padding: 0 4px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .message.user {
            background: #0f3460;
            border-radius: 16px 16px 4px 16px;
        }
        .message.ai {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 16px 16px 16px 4px;
        }
        .input-area {
            padding: 16px 20px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-wrapper {
            position: relative;
            flex: 1;
        }
        .input-area input,
        .input-wrapper textarea {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 24px;
            color: #eee;
            font-size: 15px;
            outline: none;
            resize: none;
            font-family: inherit;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .newline-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 26px;
            height: 26px;
            border: none;
            background: #0f3460;
            color: #aaa;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .newline-btn:active {
            opacity: 0.7;
        }
        .input-area button {
            padding: 12px 20px;
            background: #0f3460;
            border: none;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 16px;
            padding: 24px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal h3 {
            font-size: 15px;
            font-weight: 500;
            color: #ccc;
        }
        .modal input {
            padding: 10px 14px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            color: #eee;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-btns button {
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-cancel {
            background: #0f3460;
            color: #aaa;
        }
        .btn-confirm {
            background: #3a5a8a;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ 我的陪伴空間</h1>
        <div class="ai-switch">
            <button class="ai-btn active" id="btn-claude" onclick="switchAI('claude', event)">晏</button>
            <button class="ai-btn" id="btn-gemini" onclick="switchAI('gemini', event)">Gemini</button>
        </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="input" placeholder="說點什麼…" rows="1" onkeydown="handleKeydown(event)" oninput="autoGrow(this)"></textarea>
            <button class="newline-btn" type="button" onclick="insertNewline()">⏎</button>
        </div>
        <button onclick="sendMessage()">送出</button>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-title">修改名稱</h3>
            <input type="text" id="modal-input" placeholder="輸入新名稱">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-confirm" onclick="confirmName()">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentAI = 'claude';
        let names = {
            user: '然然',
            claude: '晏',
            gemini: 'Gemini'
        };
        let editingTarget = null;
        let holdTimer = null;

        async function loadNames() {
            try {
                const res = await fetch('/names');
                const data = await res.json();
                names.user = data.name_user || names.user;
                names.claude = data.name_claude || names.claude;
                names.gemini = data.name_gemini || names.gemini;
            } catch (e) {}
            document.getElementById('btn-claude').textContent = names.claude;
            document.getElementById('btn-gemini').textContent = names.gemini;
        }

        async function loadHistory() {
            const messages = document.getElementById('messages');
            messages.innerHTML = '';
            try {
                const res = await fetch(`/history/${currentAI}`);
                const data = await res.json();
                data.history.forEach(m => {
                    const role = m.role === 'user' ? 'user' : 'ai';
                    addMessage(m.content, role);
                });
            } catch (e) {}
        }

        function switchAI(ai, e) {
            currentAI = ai;
            document.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            loadHistory();
        }

        function addMessage(text, role) {
            const target = role === 'user' ? 'user' : currentAI;
            const displayName = names[target];
            const initial = displayName[0];

            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.textContent = initial;

            avatar.addEventListener('mousedown', () => startHold(target));
            avatar.addEventListener('touchstart', () => startHold(target), { passive: true });
            avatar.addEventListener('mouseup', cancelHold);
            avatar.addEventListener('touchend', cancelHold);
            avatar.addEventListener('mouseleave', cancelHold);

            const block = document.createElement('div');
            block.className = 'message-block';

            const name = document.createElement('div');
            name.className = 'message-name';
            name.textContent = displayName;

            const bubble = document.createElement('div');
            bubble.className = `message ${role}`;
            bubble.textContent = text;

            block.appendChild(name);
            block.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(block);

            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
        }

        function startHold(target) {
            holdTimer = setTimeout(() => openModal(target), 600);
        }

        function cancelHold() {
            clearTimeout(holdTimer);
        }

        function openModal(target) {
            editingTarget = target;
            document.getElementById('modal-title').textContent =
                target === 'user' ? '修改你的名稱' : `修改 ${names[target]} 的名稱`;
            document.getElementById('modal-input').value = names[target];
            document.getElementById('modal').classList.add('show');
            document.getElementById('modal-input').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            editingTarget = null;
        }

        async function confirmName() {
            const val = document.getElementById('modal-input').value.trim();
            if (!val || !editingTarget) return;
            names[editingTarget] = val;

            const keyMap = { user: 'name_user', claude: 'name_claude', gemini: 'name_gemini' };
            await fetch('/names', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: keyMap[editingTarget], name: val })
            });

            if (editingTarget === 'claude') document.getElementById('btn-claude').textContent = val;
            if (editingTarget === 'gemini') document.getElementById('btn-gemini').textContent = val;

            closeModal();
            loadHistory();
        }

        document.getElementById('modal-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') confirmName();
            if (e.key === 'Escape') closeModal();
        });

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function insertNewline() {
            const el = document.getElementById('input');
            const start = el.selectionStart;
            const end = el.selectionEnd;
            const value = el.value;
            el.value = value.slice(0, start) + '\n' + value.slice(end);
            el.selectionStart = el.selectionEnd = start + 1;
            autoGrow(el);
            el.focus();
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            input.style.height = 'auto';

            addMessage(msg, 'user');

            try {
                const res = await fetch(`/chat/${currentAI}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                addMessage(data.reply, 'ai');
            } catch (e) {
                addMessage('連線失敗，請確認伺服器是否啟動。', 'ai');
            }
        }

        async function init() {
            await loadNames();
            await loadHistory();
        }

        init();
    </script>
</body>
</html>
