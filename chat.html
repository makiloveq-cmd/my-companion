<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的陪伴空間</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }
        .header {
            padding: 16px 20px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 18px; font-weight: 400; }
        .ai-switch {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .ai-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-2);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .ai-btn.active {
            background: var(--accent);
            color: #fff;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .message-row.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.15s;
        }
        .avatar:active { opacity: 0.7; }
        .avatar.user {
            background: var(--accent);
            color: #fff;
        }
        .avatar.ai {
            background: var(--surface3);
            color: var(--text-2);
        }
        .message-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }
        .message-row.user .message-block {
            align-items: flex-end;
        }
        .message-name {
            font-size: 12px;
            color: var(--text-3);
            padding: 0 4px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .message.user {
            background: var(--bubble-user);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
        }
        .message.ai {
            background: var(--bubble-ai);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 16px 16px 16px 4px;
        }
        .message img {
            max-width: 220px;
            max-height: 280px;
            border-radius: 10px;
            display: block;
            cursor: pointer;
        }
        .input-area {
            padding: 16px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 4px;
        }
        .image-preview-bar.show {
            display: flex;
        }
        .image-preview-bar img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .remove-img-btn {
            background: var(--surface2);
            border: none;
            color: var(--text-2);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .img-upload-btn {
            padding: 10px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-2);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-upload-btn:active { opacity: 0.7; }
        .input-wrapper {
            position: relative;
            flex: 1;
        }
        .input-wrapper textarea {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            resize: none;
            font-family: inherit;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .newline-btn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 26px;
            height: 26px;
            border: none;
            background: var(--surface2);
            color: var(--text-2);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .newline-btn:active { opacity: 0.7; }
        .send-btn {
            padding: 12px 20px;
            background: var(--accent);
            border: none;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
        }
        /* 圖片燈箱 */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .lightbox.show { display: flex; }
        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            border-radius: 10px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal h3 { font-size: 15px; font-weight: 500; color: var(--text-2); }
        .modal input {
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btns button { padding: 8px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; }
        .btn-cancel { background: var(--surface2); color: var(--text-2); }
        .btn-confirm { background: var(--accent); color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ 我的陪伴空間</h1>
        <div class="ai-switch">
            <button class="ai-btn active" id="btn-claude" onclick="switchAI('claude', event)">晏</button>
            <button class="ai-btn" id="btn-gemini" onclick="switchAI('gemini', event)">Gemini</button>
        </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <div class="image-preview-bar" id="imagePreviewBar">
            <img id="imagePreviewThumb" src="" alt="預覽">
            <button class="remove-img-btn" onclick="removeImage()">✕</button>
            <span style="font-size:12px;color:var(--text-3);">圖片已選擇</span>
        </div>
        <div class="input-row">
            <button class="img-upload-btn" onclick="document.getElementById('imageInput').click()">🖼</button>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
            <div class="input-wrapper">
                <textarea id="input" placeholder="說點什麼…" rows="1" onkeydown="handleKeydown(event)" oninput="autoGrow(this)"></textarea>
                <button class="newline-btn" type="button" onclick="insertNewline()">⏎</button>
            </div>
            <button class="send-btn" onclick="sendMessage()">送出</button>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="">
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-title">修改名稱</h3>
            <input type="text" id="modal-input" placeholder="輸入新名稱">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-confirm" onclick="confirmName()">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentAI = 'claude';
        let names = { user: '然然', claude: '晏', gemini: 'Gemini' };
        let editingTarget = null;
        let holdTimer = null;
        let pendingImageUrl = null;

        // ===== 圖片選擇 =====
        async function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const thumb = document.getElementById('imagePreviewThumb');
            thumb.src = URL.createObjectURL(file);
            document.getElementById('imagePreviewBar').classList.add('show');

            const formData = new FormData();
            formData.append('image', file);
            try {
                const res = await fetch('/upload_image', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.url) {
                    pendingImageUrl = data.url;
                } else {
                    alert('圖片上傳失敗');
                    removeImage();
                }
            } catch (err) {
                alert('圖片上傳失敗');
                removeImage();
            }
            e.target.value = '';
        }

        function removeImage() {
            pendingImageUrl = null;
            document.getElementById('imagePreviewBar').classList.remove('show');
            document.getElementById('imagePreviewThumb').src = '';
        }

        // ===== 燈箱 =====
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('show');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
        }

        // ===== 名字 =====
        async function loadNames() {
            try {
                const res = await fetch('/names');
                const data = await res.json();
                names.user = data.name_user || names.user;
                names.claude = data.name_claude || names.claude;
                names.gemini = data.name_gemini || names.gemini;
            } catch (e) {}
            document.getElementById('btn-claude').textContent = names.claude;
            document.getElementById('btn-gemini').textContent = names.gemini;
        }

        // ===== 歷史記錄 =====
        async function loadHistory() {
            const messages = document.getElementById('messages');
            messages.innerHTML = '';
            try {
                const res = await fetch(`/history/${currentAI}`);
                const data = await res.json();
                data.history.forEach(m => {
                    const role = m.role === 'user' ? 'user' : 'ai';
                    addMessage(m.content, role, m.image_url);
                });
            } catch (e) {}
        }

        function switchAI(ai, e) {
            currentAI = ai;
            document.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            loadHistory();
        }

        // ===== 渲染訊息 =====
        function addMessage(text, role, imageUrl) {
            const target = role === 'user' ? 'user' : currentAI;
            const displayName = names[target];
            const initial = displayName[0];

            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.textContent = initial;
            avatar.addEventListener('mousedown', () => startHold(target));
            avatar.addEventListener('touchstart', () => startHold(target), { passive: true });
            avatar.addEventListener('mouseup', cancelHold);
            avatar.addEventListener('touchend', cancelHold);
            avatar.addEventListener('mouseleave', cancelHold);

            const block = document.createElement('div');
            block.className = 'message-block';

            const name = document.createElement('div');
            name.className = 'message-name';
            name.textContent = displayName;

            const bubble = document.createElement('div');
            bubble.className = `message ${role}`;

            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = '圖片';
                img.onclick = () => openLightbox(imageUrl);
                bubble.appendChild(img);
                if (text) {
                    const t = document.createElement('div');
                    t.style.marginTop = '6px';
                    t.textContent = text;
                    bubble.appendChild(t);
                }
            } else {
                bubble.textContent = text;
            }

            block.appendChild(name);
            block.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(block);

            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
        }

        // ===== 長按改名 =====
        function startHold(target) {
            holdTimer = setTimeout(() => openModal(target), 600);
        }
        function cancelHold() { clearTimeout(holdTimer); }
        function openModal(target) {
            editingTarget = target;
            document.getElementById('modal-title').textContent =
                target === 'user' ? '修改你的名稱' : `修改 ${names[target]} 的名稱`;
            document.getElementById('modal-input').value = names[target];
            document.getElementById('modal').classList.add('show');
            document.getElementById('modal-input').focus();
        }
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            editingTarget = null;
        }
        async function confirmName() {
            const val = document.getElementById('modal-input').value.trim();
            if (!val || !editingTarget) return;
            names[editingTarget] = val;
            const keyMap = { user: 'name_user', claude: 'name_claude', gemini: 'name_gemini' };
            await fetch('/names', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: keyMap[editingTarget], name: val })
            });
            if (editingTarget === 'claude') document.getElementById('btn-claude').textContent = val;
            if (editingTarget === 'gemini') document.getElementById('btn-gemini').textContent = val;
            closeModal();
            loadHistory();
        }
        document.getElementById('modal-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') confirmName();
            if (e.key === 'Escape') closeModal();
        });

        // ===== 輸入框 =====
        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }
        function insertNewline() {
            const el = document.getElementById('input');
            const start = el.selectionStart;
            const end = el.selectionEnd;
            el.value = el.value.slice(0, start) + '\n' + el.value.slice(end);
            el.selectionStart = el.selectionEnd = start + 1;
            autoGrow(el);
            el.focus();
        }
        function generateMessageId() {
            return 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
        }

        // ===== 送出 =====
        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg && !pendingImageUrl) return;
            input.value = '';
            input.style.height = 'auto';

            const imageUrl = pendingImageUrl;
            removeImage();

            const messageId = generateMessageId();
            addMessage(msg, 'user', imageUrl);
            await sendToServer(msg, messageId, currentAI, imageUrl);
        }

        async function sendToServer(msg, messageId, ai, imageUrl) {
            const row = addPendingRow();
            try {
                const res = await fetch(`/chat/${ai}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, message_id: messageId, image_url: imageUrl || null })
                });
                if (!res.ok) throw new Error('server error');
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                row.remove();
                addMessage(data.reply, 'ai');
            } catch (e) {
                row.remove();
                addFailedRow(msg, messageId, ai, imageUrl);
            }
        }

        function addPendingRow() {
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.innerHTML = `<div class="message-block"><div class="message ai" style="opacity:0.5;">…</div></div>`;
            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
            return row;
        }

        function addFailedRow(msg, messageId, ai, imageUrl) {
            const row = document.createElement('div');
            row.className = 'message-row ai';
            const block = document.createElement('div');
            block.className = 'message-block';
            const bubble = document.createElement('div');
            bubble.className = 'message ai';
            bubble.style.color = 'var(--danger)';
            bubble.textContent = '連線失敗，訊息可能未送達。';
            const retryBtn = document.createElement('button');
            retryBtn.textContent = '重試';
            retryBtn.style.cssText = 'margin-top:6px;padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:13px;cursor:pointer;align-self:flex-start;';
            retryBtn.onclick = async () => {
                row.remove();
                await sendToServer(msg, messageId, ai, imageUrl);
            };
            block.appendChild(bubble);
            block.appendChild(retryBtn);
            row.appendChild(block);
            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
        }

        async function init() {
            await loadNames();
            await loadHistory();
        }
        init();
    </script>
    <script src="/theme.js"></script>
</body>
</html>
