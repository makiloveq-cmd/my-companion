<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日記 - Rifugio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0eb;
            color: #3a3330;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 20px 24px 12px;
            text-align: center;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 28px;
        }
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .compose {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .compose textarea {
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            color: #3a3330;
            min-height: 60px;
        }
        .compose-actions {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .btn {
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            background: #b07d5a;
            color: #fff;
        }
        .btn.secondary {
            background: #efe6dd;
            color: #9a8878;
        }
        .btn.danger {
            background: #f0e0e0;
            color: #c07070;
        }
        .entry-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .entry-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            background: #2a3a5a;
            color: #fff;
            flex-shrink: 0;
        }
        .avatar.然然 { background: #3a5a8a; }
        .entry-meta {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .entry-author {
            font-size: 13px;
            font-weight: 500;
        }
        .entry-time {
            font-size: 11px;
            color: #9a8878;
        }
        .entry-actions {
            display: flex;
            gap: 8px;
        }
        .entry-action-btn {
            font-size: 11px;
            color: #9a8878;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .entry-action-btn:hover { background: #f0e9e2; }
        .entry-action-btn.delete { color: #c07070; }
        .entry-content {
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .edit-area {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .edit-area textarea {
            border: 1px solid #e8e0d8;
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            min-height: 80px;
        }
        .edit-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .comments {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #f0e9e2;
            padding-top: 10px;
        }
        .comment {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .comment .avatar {
            width: 24px;
            height: 24px;
            font-size: 10px;
        }
        .comment-bubble {
            background: #f7f2ed;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
            flex: 1;
        }
        .comment-author {
            font-size: 11px;
            color: #9a8878;
            margin-bottom: 2px;
        }
        .comment-input {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .comment-input input {
            flex: 1;
            border: 1px solid #f0e9e2;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            outline: none;
        }
        .comment-input button {
            border: none;
            background: #efe6dd;
            color: #9a8878;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .ai-comment-btn {
            font-size: 11px;
            color: #b07d5a;
            background: none;
            border: none;
            cursor: pointer;
            align-self: flex-start;
        }
        .empty {
            text-align: center;
            color: #b3a596;
            font-size: 13px;
            padding: 40px 0;
        }
        .tab-bar {
            background: #fff;
            border-top: 1px solid #e8e0d8;
            display: flex;
            padding: 10px 0 16px;
        }
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #9a8878;
            font-size: 10px;
        }
        .tab.active { color: #b07d5a; }
        .tab-icon { font-size: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Diary</h1>
    </div>

    <div class="main" id="main">
        <div class="compose">
            <textarea id="new-entry" placeholder="寫點什麼…"></textarea>
            <div class="compose-actions">
                <button class="btn secondary" onclick="askAiEntry()">邀請晏寫日記</button>
                <button class="btn" onclick="postEntry()">發布</button>
            </div>
        </div>
        <div id="entries"></div>
    </div>

    <div class="tab-bar">
        <a class="tab" href="/">
            <div class="tab-icon">⌂</div>
            <div>首頁</div>
        </a>
        <a class="tab" href="/chatroom">
            <div class="tab-icon">✦</div>
            <div>聊天</div>
        </a>
        <a class="tab" href="#">
            <div class="tab-icon">◎</div>
            <div>朋友圈</div>
        </a>
        <a class="tab active" href="/diary_page">
            <div class="tab-icon">✐</div>
            <div>日記</div>
        </a>
        <a class="tab" href="#">
            <div class="tab-icon">⋯</div>
            <div>更多</div>
        </a>
    </div>

    <script>
        function avatarInitial(author) {
            return author === '然然' ? '然' : '晏';
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadEntries() {
            const res = await fetch('/diary');
            const data = await res.json();
            const container = document.getElementById('entries');
            container.innerHTML = '';

            if (data.entries.length === 0) {
                container.innerHTML = '<div class="empty">還沒有日記，寫下第一篇吧</div>';
                return;
            }

            data.entries.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'entry-card';

                let commentsHtml = '';
                entry.comments.forEach(c => {
                    commentsHtml += `
                        <div class="comment">
                            <div class="avatar ${c.author}">${avatarInitial(c.author)}</div>
                            <div class="comment-bubble">
                                <div class="comment-author">${c.author}</div>
                                <div>${escapeHtml(c.content)}</div>
                            </div>
                        </div>
                    `;
                });

                const isUser = entry.author === '然然';
                const actionBtns = isUser ? `
                    <div class="entry-actions">
                        <button class="entry-action-btn" onclick="startEdit(${entry.id}, this)">編輯</button>
                        <button class="entry-action-btn delete" onclick="deleteEntry(${entry.id})">刪除</button>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="entry-header">
                        <div class="avatar ${entry.author}">${avatarInitial(entry.author)}</div>
                        <div class="entry-meta">
                            <div class="entry-author">${entry.author}</div>
                            <div class="entry-time">${formatTime(entry.created_at)}</div>
                        </div>
                        ${actionBtns}
                    </div>
                    <div class="entry-content" id="content-${entry.id}">${escapeHtml(entry.content)}</div>
                    <div class="edit-area" id="edit-${entry.id}">
                        <textarea id="edit-text-${entry.id}">${escapeHtml(entry.content)}</textarea>
                        <div class="edit-btns">
                            <button class="btn secondary" onclick="cancelEdit(${entry.id})">取消</button>
                            <button class="btn" onclick="saveEdit(${entry.id})">儲存</button>
                        </div>
                    </div>
                    <div class="comments">${commentsHtml}</div>
                    <button class="ai-comment-btn" onclick="askAiComment(${entry.id}, this)">邀請晏留言</button>
                    <div class="comment-input">
                        <input type="text" placeholder="留言…" onkeydown="if(event.key==='Enter')postComment(${entry.id}, this)">
                        <button onclick="postComment(${entry.id}, this.previousElementSibling)">送出</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function startEdit(id, btn) {
            document.getElementById(`content-${id}`).style.display = 'none';
            const editArea = document.getElementById(`edit-${id}`);
            editArea.style.display = 'flex';
            const textarea = document.getElementById(`edit-text-${id}`);
            textarea.value = document.getElementById(`content-${id}`).textContent;
            textarea.focus();
        }

        function cancelEdit(id) {
            document.getElementById(`content-${id}`).style.display = '';
            document.getElementById(`edit-${id}`).style.display = 'none';
        }

        async function saveEdit(id) {
            const content = document.getElementById(`edit-text-${id}`).value.trim();
            if (!content) return;
            await fetch(`/diary/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            loadEntries();
        }

        async function deleteEntry(id) {
            if (!confirm('確定要刪除這篇日記嗎？')) return;
            await fetch(`/diary/${id}`, { method: 'DELETE' });
            loadEntries();
        }

        async function postEntry() {
            const textarea = document.getElementById('new-entry');
            const content = textarea.value.trim();
            if (!content) return;
            await fetch('/diary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: '然然', content })
            });
            textarea.value = '';
            loadEntries();
        }

        async function askAiEntry() {
            await fetch('/diary/ai_entry', { method: 'POST' });
            loadEntries();
        }

        async function postComment(entryId, input) {
            const content = input.value.trim();
            if (!content) return;
            await fetch(`/diary/${entryId}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: '然然', content })
            });
            input.value = '';
            loadEntries();
        }

        async function askAiComment(entryId, btn) {
            btn.disabled = true;
            await fetch(`/diary/${entryId}/ai_comment`, { method: 'POST' });
            loadEntries();
        }

        loadEntries();
    </script>
</body>
</html>
