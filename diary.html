<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>日記 - Rifugio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }
        .header {
            padding: 20px 24px 12px;
            text-align: center;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 28px;
        }
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .compose {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .compose textarea {
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            background: transparent;
            min-height: 60px;
        }
        .compose-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .compose-ai-btns {
            display: flex;
            gap: 6px;
        }
        .btn {
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
        }
        .btn.secondary {
            background: var(--surface2);
            color: var(--text-2);
        }
        .entry-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .entry-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            background: var(--surface3);
            color: var(--text);
            flex-shrink: 0;
        }
        .avatar.然然 { background: var(--accent); color: #fff; }
        .avatar.晏 { background: var(--surface3); color: var(--text); }
        .avatar.熠 { background: var(--surface3); color: var(--text); }
        .entry-meta {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .entry-author { font-size: 13px; font-weight: 500; }
        .entry-time { font-size: 11px; color: var(--text-3); }
        .entry-actions { display: flex; gap: 8px; }
        .entry-action-btn {
            font-size: 11px;
            color: var(--text-3);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .entry-action-btn:hover { background: var(--surface2); }
        .entry-action-btn.delete { color: var(--danger); }
        .entry-content {
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .edit-area {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .edit-area textarea {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            min-height: 80px;
            background: var(--bg);
            color: var(--text);
        }
        .edit-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .comments {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .comment {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .comment .avatar {
            width: 26px;
            height: 26px;
            font-size: 10px;
        }
        .comment-right { flex: 1; }
        .comment-bubble {
            background: var(--surface2);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
        }
        .comment-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }
        .comment-author { font-size: 11px; color: var(--text-3); font-weight: 500; }
        .comment-reply-tag { font-size: 11px; color: var(--accent); }
        .comment-reply-preview {
            font-size: 11px;
            color: var(--text-3);
            background: var(--surface3);
            border-radius: 6px;
            padding: 4px 8px;
            margin-bottom: 4px;
            border-left: 2px solid var(--accent);
        }
        .comment-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .comment-action-btn {
            font-size: 11px;
            color: var(--text-3);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
        }
        .comment-action-btn.reply-btn { color: var(--accent); }
        .comment-action-btn.delete { color: var(--danger); }
        .comment-edit-area {
            display: none;
            gap: 6px;
            margin-top: 6px;
        }
        .comment-edit-area input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        .reply-hint {
            display: none;
            font-size: 12px;
            color: var(--accent);
            background: var(--surface2);
            border-radius: 8px;
            padding: 6px 10px;
            border-left: 2px solid var(--accent);
            cursor: pointer;
        }
        .comment-input {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }
        .comment-input-row {
            display: flex;
            gap: 8px;
        }
        .comment-input input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }
        .comment-input button {
            border: none;
            background: var(--surface2);
            color: var(--text-2);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .ai-comment-btns {
            display: flex;
            gap: 8px;
        }
        .ai-comment-btn {
            font-size: 11px;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        .ai-comment-btn:disabled { opacity: 0.4; cursor: default; }
        .empty {
            text-align: center;
            color: var(--text-3);
            font-size: 13px;
            padding: 40px 0;
        }
        .tab-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 10px 0 16px;
        }
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: var(--text-3);
            font-size: 10px;
        }
        .tab.active { color: var(--accent); }
        .tab-icon { font-size: 20px; }
    
    /* iPhone safe area */
    .input-area, .tab-bar, .reply-bar {
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    

    /* Header safe area top */
    .header, .ph {
      padding-top: max(14px, env(safe-area-inset-top));
    }
    
</style>
</head>
<body>
    <div class="header"><h1>Diary</h1></div>

    <div class="main" id="main">
        <div class="compose">
            <textarea id="new-entry" placeholder="寫點什麼…"></textarea>
            <div class="compose-actions">
                <div class="compose-ai-btns">
                    <button class="btn secondary" onclick="askAiEntry('claude')">邀晏寫日記</button>
                    <button class="btn secondary" onclick="askAiEntry('gemini')">邀熠寫日記</button>
                </div>
                <button class="btn" onclick="postEntry()">發布</button>
            </div>
        </div>
        <div id="entries"></div>
    </div>

    <div class="tab-bar">
        <a class="tab" href="/"><div class="tab-icon">⌂</div><div>首頁</div></a>
        <a class="tab" href="/chatlist_page"><div class="tab-icon">✦</div><div>聊天</div></a>
        <a class="tab" href="#"><div class="tab-icon">◎</div><div>朋友圈</div></a>
        <a class="tab active" href="/diary_page"><div class="tab-icon">✐</div><div>日記</div></a>
        <a class="tab" href="/persona_page"><div class="tab-icon">⋯</div><div>人物書</div></a>
    </div>

    <script>
        // 頭像首字對應（未來加宸：map['宸'] = '宸'）
        function avatarInitial(author) {
            const map = { '然然': '然', '晏': '晏', '熠': '熠' };
            return map[author] || author.charAt(0);
        }

        function formatTime(ts) {
            const d = new Date(ts);
            const offset = 8 * 60;
            const local = new Date(d.getTime() + (offset - d.getTimezoneOffset()) * 60000);
            return `${local.getMonth()+1}/${local.getDate()} ${String(local.getHours()).padStart(2,'0')}:${String(local.getMinutes()).padStart(2,'0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let replyState = {};

        async function loadEntries() {
            const res = await fetch('/diary');
            const data = await res.json();
            const container = document.getElementById('entries');
            container.innerHTML = '';

            if (data.entries.length === 0) {
                container.innerHTML = '<div class="empty">還沒有日記，寫下第一篇吧</div>';
                return;
            }

            data.entries.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'entry-card';

                const commentMap = {};
                entry.comments.forEach(c => commentMap[c.id] = c);

                let commentsHtml = '';
                entry.comments.forEach(c => {
                    const replyTo = c.reply_to ? commentMap[c.reply_to] : null;
                    const replyPreview = replyTo
                        ? `<div class="comment-reply-preview">${escapeHtml(replyTo.author)}：${escapeHtml(replyTo.content.substring(0, 30))}${replyTo.content.length > 30 ? '…' : ''}</div>`
                        : '';
                    const replyTag = replyTo
                        ? `<span class="comment-reply-tag">回覆 ${escapeHtml(replyTo.author)}</span>`
                        : '';
                    const isUser = c.author === '然然';
                    const actionBtns = isUser
                        ? `<button class="comment-action-btn delete" onclick="deleteComment(${c.id})">刪除</button>
                           <button class="comment-action-btn" onclick="startEditComment(${c.id})">編輯</button>`
                        : '';

                    commentsHtml += `
                        <div class="comment" id="comment-${c.id}">
                            <div class="avatar ${escapeHtml(c.author)}">${avatarInitial(c.author)}</div>
                            <div class="comment-right">
                                <div class="comment-bubble">
                                    <div class="comment-header">
                                        <span class="comment-author">${escapeHtml(c.author)}</span>
                                        ${replyTag}
                                    </div>
                                    ${replyPreview}
                                    <div id="comment-text-${c.id}">${escapeHtml(c.content)}</div>
                                </div>
                                <div class="comment-actions">
                                    <button class="comment-action-btn reply-btn" onclick="startReply(${entry.id}, ${c.id}, '${escapeHtml(c.author)}')">回覆</button>
                                    ${actionBtns}
                                </div>
                                <div class="comment-edit-area" id="edit-comment-${c.id}" style="display:none;flex-direction:row;gap:6px;margin-top:6px;">
                                    <input type="text" value="${escapeHtml(c.content)}" id="edit-comment-input-${c.id}">
                                    <button class="btn secondary" style="padding:4px 10px;font-size:12px;" onclick="cancelEditComment(${c.id})">取消</button>
                                    <button class="btn" style="padding:4px 10px;font-size:12px;" onclick="saveEditComment(${c.id})">儲存</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                const isUserEntry = entry.author === '然然';
                const actionBtns = isUserEntry ? `
                    <div class="entry-actions">
                        <button class="entry-action-btn" onclick="startEdit(${entry.id})">編輯</button>
                        <button class="entry-action-btn delete" onclick="deleteEntry(${entry.id})">刪除</button>
                    </div>` : '';

                card.innerHTML = `
                    <div class="entry-header">
                        <div class="avatar ${escapeHtml(entry.author)}">${avatarInitial(entry.author)}</div>
                        <div class="entry-meta">
                            <div class="entry-author">${escapeHtml(entry.author)}</div>
                            <div class="entry-time">${formatTime(entry.created_at)}</div>
                        </div>
                        ${actionBtns}
                    </div>
                    <div class="entry-content" id="content-${entry.id}">${escapeHtml(entry.content)}</div>
                    <div class="edit-area" id="edit-${entry.id}">
                        <textarea id="edit-text-${entry.id}">${escapeHtml(entry.content)}</textarea>
                        <div class="edit-btns">
                            <button class="btn secondary" onclick="cancelEdit(${entry.id})">取消</button>
                            <button class="btn" onclick="saveEdit(${entry.id})">儲存</button>
                        </div>
                    </div>
                    <div class="comments">${commentsHtml}</div>
                    <div class="reply-hint" id="reply-hint-${entry.id}"></div>
                    <div class="ai-comment-btns">
                        <button class="ai-comment-btn" id="ai-btn-claude-${entry.id}" onclick="askAiComment(${entry.id}, 'claude', this)">邀晏留言</button>
                        <button class="ai-comment-btn" id="ai-btn-gemini-${entry.id}" onclick="askAiComment(${entry.id}, 'gemini', this)">邀熠留言</button>
                    </div>
                    <div class="comment-input">
                        <div class="comment-input-row">
                            <input type="text" id="comment-input-${entry.id}" placeholder="留言…" onkeydown="if(event.key==='Enter')postComment(${entry.id})">
                            <button onclick="postComment(${entry.id})">送出</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function startReply(entryId, commentId, author) {
            replyState[entryId] = { commentId, author };
            const hint = document.getElementById(`reply-hint-${entryId}`);
            hint.style.display = 'block';
            hint.textContent = `回覆 ${author}　✕`;
            hint.onclick = () => cancelReply(entryId);
            document.getElementById(`comment-input-${entryId}`).focus();
        }

        function cancelReply(entryId) {
            replyState[entryId] = null;
            const hint = document.getElementById(`reply-hint-${entryId}`);
            hint.style.display = 'none';
        }

        function startEditComment(id) {
            document.getElementById(`edit-comment-${id}`).style.display = 'flex';
        }

        function cancelEditComment(id) {
            document.getElementById(`edit-comment-${id}`).style.display = 'none';
        }

        async function saveEditComment(id) {
            const content = document.getElementById(`edit-comment-input-${id}`).value.trim();
            if (!content) return;
            await fetch(`/diary/comment/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            loadEntries();
        }

        async function deleteComment(id) {
            if (!confirm('確定要刪除這則留言嗎？')) return;
            await fetch(`/diary/comment/${id}`, { method: 'DELETE' });
            loadEntries();
        }

        function startEdit(id) {
            document.getElementById(`content-${id}`).style.display = 'none';
            document.getElementById(`edit-${id}`).style.display = 'flex';
            document.getElementById(`edit-text-${id}`).focus();
        }

        function cancelEdit(id) {
            document.getElementById(`content-${id}`).style.display = '';
            document.getElementById(`edit-${id}`).style.display = 'none';
        }

        async function saveEdit(id) {
            const content = document.getElementById(`edit-text-${id}`).value.trim();
            if (!content) return;
            await fetch(`/diary/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            loadEntries();
        }

        async function deleteEntry(id) {
            if (!confirm('確定要刪除這篇日記嗎？')) return;
            await fetch(`/diary/${id}`, { method: 'DELETE' });
            loadEntries();
        }

        async function postEntry() {
            const textarea = document.getElementById('new-entry');
            const content = textarea.value.trim();
            if (!content) return;
            await fetch('/diary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: '然然', content })
            });
            textarea.value = '';
            loadEntries();
        }

        async function askAiEntry(botKey) {
            await fetch(`/diary/ai_entry/${botKey}`, { method: 'POST' });
            loadEntries();
        }

        async function postComment(entryId) {
            const input = document.getElementById(`comment-input-${entryId}`);
            const content = input.value.trim();
            if (!content) return;
            const reply = replyState[entryId];
            await fetch(`/diary/${entryId}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    author: '然然',
                    content,
                    reply_to: reply ? reply.commentId : null
                })
            });
            input.value = '';
            cancelReply(entryId);
            loadEntries();
        }

        async function askAiComment(entryId, botKey, btn) {
            btn.disabled = true;
            await fetch(`/diary/${entryId}/ai_comment/${botKey}`, { method: 'POST' });
            loadEntries();
        }

        loadEntries();
    </script>
    <script src="/theme.js"></script>
</body>
</html>
