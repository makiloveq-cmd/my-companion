<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rifugio — 訪客空間</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0f1117; --surface: #1a1d27; --surface2: #222535; --border: rgba(255,255,255,0.08); --text: #e8e6e0; --text-2: #a09890; --text-3: #666; --accent: #3a5a8a; --warn: #c47a2a; --danger: #a03030; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
.header { padding: max(44px, env(safe-area-inset-top)) 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.header-name { font-size: 17px; font-weight: 500; }
.header-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header-countdown { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: rgba(196,122,42,0.15); color: var(--warn); display: none; }
.header-countdown.danger { background: rgba(160,48,48,0.15); color: var(--danger); }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 78%; }
.msg.ai { align-self: flex-start; }
.msg.user { align-self: flex-end; }
.bubble { padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.6; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--border); }
.msg.user .bubble { background: var(--accent); color: #fff; }
.input-area { padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom)); flex-shrink: 0; }
.input-box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; color: var(--text); font-size: 15px; outline: none; font-family: inherit; resize: none; max-height: 100px; }
.send-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0; }
.send-btn:disabled { opacity: 0.4; }
.ended-notice { text-align: center; padding: 2rem; color: var(--text-3); font-size: 14px; }
.dot-anim span { animation: blink 1.4s infinite; display: inline-block; }
.dot-anim span:nth-child(2) { animation-delay: 0.2s; }
.dot-anim span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

/* 密碼畫面 */
.pw-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 2rem; }
.pw-title { font-size: 20px; color: var(--text); }
.pw-sub { font-size: 14px; color: var(--text-3); }
.pw-input { width: 100%; max-width: 300px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; outline: none; font-family: inherit; text-align: center; letter-spacing: 2px; }
.pw-btn { width: 100%; max-width: 300px; padding: 12px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-size: 16px; cursor: pointer; font-family: inherit; }
.pw-error { font-size: 13px; color: #e06060; }

/* 提示彈窗 */
.toast-overlay { position: fixed; inset: 0; z-index: 999; display: flex; align-items: flex-end; justify-content: center; padding: 0 20px max(24px, env(safe-area-inset-bottom)); pointer-events: none; }
.toast-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 10px; pointer-events: all; transform: translateY(120%); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.toast-box.show { transform: translateY(0); }
.toast-icon { font-size: 22px; }
.toast-title { font-size: 15px; font-weight: 500; color: var(--text); }
.toast-body { font-size: 13px; color: var(--text-2); line-height: 1.5; }
.toast-close { align-self: flex-end; padding: 6px 16px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div class="header" style="display:none;" id="chatHeader">
  <div class="header-name" id="hdrName">載入中…</div>
  <div class="header-sub">
    <span id="hdrSub"></span>
    <span class="header-countdown" id="hdrCountdown"></span>
  </div>
</div>
<div id="pwScreen" class="pw-screen">
  <div class="pw-title">Rifugio</div>
  <div class="pw-sub">請輸入密碼進入訪客空間</div>
  <input class="pw-input" id="pwInput" type="password" placeholder="••••••">
  <div class="pw-error" id="pwError" style="display:none;">密碼錯誤，請重試</div>
  <button class="pw-btn" id="pwBtn">進入</button>
</div>
<div class="messages" id="msgs" style="display:none;"></div>
<div class="input-area" id="inputArea" style="display:none;">
  <button class="send-btn" id="newlineBtn" style="background:var(--surface);color:var(--text-2);font-size:13px;" title="換行">↵</button>
  <textarea class="input-box" id="inputBox" placeholder="說點什麼…" rows="1"></textarea>
  <button class="send-btn" id="sendBtn">›</button>
</div>

<!-- 提示彈窗 -->
<div class="toast-overlay" id="toastOverlay">
  <div class="toast-box" id="toastBox">
    <div class="toast-icon" id="toastIcon"></div>
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-body" id="toastBody"></div>
    <button class="toast-close" id="toastClose">知道了</button>
  </div>
</div>

<script>
const token = location.pathname.split('/visit/')[1];
let ended = false;
let botName = '晏';
let sessionPassword = '';
let expiresAt = null;
let maxMessages = 50;
let msgCount = 0;
let warned10min = false;
let warned5msg = false;
let countdownTimer = null;
let pollTimer = null;

// ── 彈窗 ──
function showToast(icon, title, body, autoDismiss = 0) {
  document.getElementById('toastIcon').textContent = icon;
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastBody').textContent = body;
  const box = document.getElementById('toastBox');
  box.classList.add('show');
  const close = document.getElementById('toastClose');
  const dismiss = () => box.classList.remove('show');
  close.onclick = dismiss;
  if (autoDismiss > 0) setTimeout(dismiss, autoDismiss);
}

// ── header 倒計時 ──
function startCountdown() {
  if (!expiresAt) return;
  const el = document.getElementById('hdrCountdown');
  el.style.display = 'inline-block';

  function tick() {
    const diff = Math.floor((new Date(expiresAt) - Date.now()) / 1000);
    if (diff <= 0) {
      el.textContent = '時間到';
      el.classList.add('danger');
      clearInterval(countdownTimer);
      showEnded('對話時間已結束，感謝你的到來。');
      return;
    }
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    el.textContent = `剩 ${m}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('danger', diff <= 60);
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

// ── 定期輪詢狀態（每30秒）──
function startPoll() {
  pollTimer = setInterval(async () => {
    if (ended) { clearInterval(pollTimer); return; }
    try {
      const res = await fetch(`/guest/${token}/info`);
      const data = await res.json();
      if (!data || data.status !== 'active') {
        showEnded('對話已結束。');
        return;
      }
      msgCount = data.message_count || 0;
      checkWarnings();
    } catch(e) {}
  }, 30000);
}

// ── 警告檢查 ──
function checkWarnings() {
  // 剩10分鐘提示
  if (expiresAt && !warned10min) {
    const diff = (new Date(expiresAt) - Date.now()) / 1000 / 60;
    if (diff <= 10 && diff > 0) {
      warned10min = true;
      showToast('⏳', '還有10分鐘', `這次對話將在約 ${Math.ceil(diff)} 分鐘後結束，想說的話要加快囉。`);
      startCountdown();
    }
  }
  // 剩5則提示
  if (!warned5msg) {
    const remaining = maxMessages - msgCount;
    if (remaining <= 5 && remaining > 0) {
      warned5msg = true;
      showToast('💬', `還剩 ${remaining} 則訊息`, '對話次數快到上限了，把想說的都說出來吧。');
    }
    if (remaining <= 0) {
      showEnded('對話次數已達上限，感謝你的到來。');
    }
  }
}

async function verifyAndEnter(pw) {
  try {
    const res = await fetch(`/guest/${token}/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.ok) {
      sessionPassword = pw;
      document.getElementById('pwScreen').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'block';
      document.getElementById('msgs').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';
      await initChat();
    } else {
      document.getElementById('pwError').style.display = 'block';
    }
  } catch (e) {
    document.getElementById('pwError').style.display = 'block';
  }
}

async function checkPassword() {
  try {
    const res = await fetch(`/guest/${token}/info`);
    const data = await res.json();
    if (data.error || data.status !== 'active') {
      showDirectError('這個連結已無效或已結束。');
      return;
    }
    // 儲存 session 資訊
    expiresAt = data.expires_at || null;
    maxMessages = data.max_messages || 50;
    msgCount = data.message_count || 0;

    botName = '晏';
    document.getElementById('hdrName').textContent = botName;
    document.getElementById('hdrSub').textContent = `訪客：${data.guest_name}`;

    // 若剩餘時間已 ≤10 分鐘，進入就直接啟動倒計時
    if (expiresAt) {
      const diffMin = (new Date(expiresAt) - Date.now()) / 1000 / 60;
      if (diffMin <= 10) { warned10min = true; }
    }

    const verRes = await fetch(`/guest/${token}/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: '' })
    });
    const verData = await verRes.json();
    if (verData.ok) {
      document.getElementById('pwScreen').style.display = 'none';
      document.getElementById('chatHeader').style.display = 'block';
      document.getElementById('msgs').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';
      await initChat();
    }
  } catch (e) {
    showDirectError('載入失敗，請重試。');
  }
}

function showDirectError(msg) {
  document.getElementById('pwScreen').innerHTML = `<div style="color:var(--text-3);font-size:14px;text-align:center;">${msg}</div>`;
}

async function initChat() {
  // 若剩10分鐘內，直接開始倒計時
  if (expiresAt) {
    const diffMin = (new Date(expiresAt) - Date.now()) / 1000 / 60;
    if (diffMin <= 10) startCountdown();
  }
  // 剩5則以下直接標記已警告（避免進入就跳）
  if (maxMessages - msgCount <= 5) warned5msg = true;

  startPoll();

  try {
    const res = await fetch(`/guest/${token}/history`);
    const data = await res.json();
    if (data.messages && data.messages.length > 0) {
      data.messages.forEach(m => addMsg(m.role === 'user' ? 'user' : 'ai', m.content));
    } else {
      addMsg('ai', `你好，我是${botName}。很高興認識你。`);
    }
  } catch (e) {
    addMsg('ai', `你好，我是${botName}。很高興認識你。`);
  }
}

function addMsg(role, text) {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addLoading() {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="bubble dot-anim"><span>●</span><span>●</span><span>●</span></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function showEnded(msg) {
  ended = true;
  clearInterval(countdownTimer);
  clearInterval(pollTimer);
  document.getElementById('inputArea').style.display = 'none';
  const countdown = document.getElementById('hdrCountdown');
  if (countdown) { countdown.textContent = '已結束'; countdown.classList.add('danger'); countdown.style.display = 'inline-block'; }
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'ended-notice';
  div.textContent = msg;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function send() {
  if (ended) return;
  const input = document.getElementById('inputBox');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  input.style.height = 'auto';
  addMsg('user', msg);
  msgCount++;
  const loading = addLoading();
  document.getElementById('sendBtn').disabled = true;
  try {
    const res = await fetch(`/guest/${token}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, password: sessionPassword })
    });
    const data = await res.json();
    loading.remove();
    if (data.reply) {
      botName = data.name || botName;
      addMsg('ai', data.reply);
      checkWarnings();
    } else if (data.error === 'expired') {
      showEnded('對話時間已結束，感謝你的到來。');
    } else if (data.error === 'message limit reached') {
      showEnded('對話次數已達上限，感謝你的到來。');
    } else if (data.error === 'session closed') {
      showEnded('對話已被結束。');
    }
  } catch (e) {
    loading.remove();
    addMsg('ai', '抱歉，出了點問題，請重試。');
    msgCount--;
  }
  document.getElementById('sendBtn').disabled = false;
}

document.getElementById('pwBtn').onclick = () => {
  const pw = document.getElementById('pwInput').value;
  verifyAndEnter(pw);
};
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pwBtn').click();
});
document.getElementById('newlineBtn').onclick = () => {
  const input = document.getElementById('inputBox');
  const pos = input.selectionStart;
  input.value = input.value.slice(0, pos) + '\n' + input.value.slice(pos);
  input.selectionStart = input.selectionEnd = pos + 1;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  input.focus();
};
document.getElementById('sendBtn').onclick = send;
document.getElementById('inputBox').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('inputBox').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

checkPassword();
</script>
</body>
</html>
