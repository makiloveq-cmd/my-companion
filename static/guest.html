<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rifugio — 訪客空間</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #222535;
  --border: rgba(255,255,255,0.08); --text: #e8e6e0;
  --text-2: #a09890; --text-3: #666; --accent: #3a5a8a;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
.header { padding: max(44px, env(safe-area-inset-top)) 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.header-name { font-size: 17px; font-weight: 500; }
.header-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 78%; }
.msg.ai { align-self: flex-start; }
.msg.user { align-self: flex-end; }
.bubble { padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.6; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--border); }
.msg.user .bubble { background: var(--accent); color: #fff; }
.input-area { padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom)); flex-shrink: 0; }
.input-box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; color: var(--text); font-size: 15px; outline: none; font-family: inherit; resize: none; max-height: 100px; }
.send-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0; }
.send-btn:disabled { opacity: 0.4; }
.ended-notice { text-align: center; padding: 2rem; color: var(--text-3); font-size: 14px; }
.dot-anim span { animation: blink 1.4s infinite; display: inline-block; }
.dot-anim span:nth-child(2) { animation-delay: 0.2s; }
.dot-anim span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
</style>
</head>
<body>
<div class="header">
  <div class="header-name" id="hdrName">載入中…</div>
  <div class="header-sub" id="hdrSub"></div>
</div>
<div class="messages" id="msgs"></div>
<div class="input-area" id="inputArea">
  <textarea class="input-box" id="inputBox" placeholder="說點什麼…" rows="1"></textarea>
  <button class="send-btn" id="sendBtn">›</button>
</div>

<script>
const token = location.pathname.split('/visit/')[1];
let ended = false;
let botName = '晏';

async function init() {
  try {
    const res = await fetch(`/guest/${token}/info`);
    const data = await res.json();
    if (data.error || data.status !== 'active') {
      showEnded('這個連結已無效或已結束。');
      return;
    }
    document.getElementById('hdrName').textContent = botName;
    document.getElementById('hdrSub').textContent = `訪客：${data.guest_name}`;
    addMsg('ai', `你好，我是${botName}。很高興認識你。`);
  } catch (e) {
    showEnded('載入失敗，請重試。');
  }
}

function addMsg(role, text) {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addLoading() {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="bubble dot-anim"><span>●</span><span>●</span><span>●</span></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function showEnded(msg) {
  ended = true;
  document.getElementById('inputArea').style.display = 'none';
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'ended-notice';
  div.textContent = msg;
  msgs.appendChild(div);
}

async function send() {
  if (ended) return;
  const input = document.getElementById('inputBox');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  input.style.height = 'auto';
  addMsg('user', msg);
  const loading = addLoading();
  document.getElementById('sendBtn').disabled = true;
  try {
    const res = await fetch(`/guest/${token}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    loading.remove();
    if (data.reply) {
      botName = data.name || botName;
      addMsg('ai', data.reply);
    } else if (data.error === 'message limit reached') {
      loading.remove();
      showEnded('對話次數已達上限，感謝你的到來。');
    }
  } catch (e) {
    loading.remove();
    addMsg('ai', '抱歉，出了點問題，請重試。');
  }
  document.getElementById('sendBtn').disabled = false;
}

document.getElementById('sendBtn').onclick = send;
document.getElementById('inputBox').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('inputBox').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

init();
</script>
</body>
</html>
