<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rifugio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }

html, body {
  font-family: -apple-system, 'Inter', sans-serif;
  color: var(--text);
  height: 100%;
  width: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

/* ── 電腦版：深色背景＋手機框 ── */
body {
  background: #080c14;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  width: 430px;
  height: 932px;
  border-radius: 54px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 0 10px #1a1f2e, 0 0 0 11px #2a3040, 0 40px 80px rgba(0,0,0,0.6);
}

/* 手機框側邊按鈕裝飾 */
#app::before {
  content: '';
  position: absolute;
  left: -10px; top: 120px;
  width: 3px; height: 28px;
  background: #1a1f2e;
  border-radius: 2px 0 0 2px;
  box-shadow: 0 44px 0 #1a1f2e, 0 88px 0 #1a1f2e;
  z-index: 999;
}
#app::after {
  content: '';
  position: absolute;
  right: -10px; top: 156px;
  width: 3px; height: 60px;
  background: #1a1f2e;
  border-radius: 0 2px 2px 0;
  z-index: 999;
}

#view {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

.tab-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 10px 0 16px;
  flex-shrink: 0;
}

/* ── 手機版（≤500px）：全版面，拿掉手機框 ── */
@media (max-width: 500px) {
  body {
    background: var(--surface);
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    border-radius: 0;
    box-shadow: none;
    padding-top: env(safe-area-inset-top, 44px);
    box-sizing: border-box;
  }
  #app::before, #app::after { display: none; }
  .tab-bar {
    padding: 10px 0 max(16px, env(safe-area-inset-bottom));
  }
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 0;
  background: none;
  border: none;
  font-family: inherit;
  text-decoration: none;
  color: var(--text-3);
  transition: color 0.15s;
}
.tab.active { color: var(--accent); }
.tab-icon { font-size: 20px; }
.tab-label { font-size: 10px; letter-spacing: 0.5px; }
.fade-enter {
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div class="tab-bar" id="tabBar">
    <button class="tab active" data-route="home">
      <div class="tab-icon">⌂</div><div class="tab-label">首頁</div>
    </button>
    <button class="tab" data-route="chatlist">
      <div class="tab-icon">✦</div><div class="tab-label">聊天</div>
    </button>
    <button class="tab" data-route="diary">
      <div class="tab-icon">🗓</div><div class="tab-label">日曆</div>
    </button>
    <button class="tab" data-route="persona">
      <div class="tab-icon">◎</div><div class="tab-label">人物書</div>
    </button>
    <button class="tab" data-route="theme">
      <div class="tab-icon">◐</div><div class="tab-label">主題</div>
    </button>
  </div>
</div>

<script>
// 全域 fetch 攔截器，自動帶入 APP_SECRET
const APP_SECRET = '__APP_SECRET_PLACEHOLDER__';
const _origFetch = window.fetch.bind(window);
window.fetch = async function(input, init = {}) {
  const url = typeof input === 'string' ? input : input.url;
  // 只攔截自己的 API，不影響外部請求
  if (url.startsWith('/') && !url.startsWith('/static/') && !url.startsWith('/firebase-messaging-sw.js')) {
    init.headers = { ...(init.headers || {}), 'X-App-Secret': APP_SECRET };
  }
  return _origFetch(input, init);
};
</script>
<script src="/theme.js"></script>

<script>
async function initWebPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const keyRes = await fetch('/vapid_public_key');
    const { public_key } = await keyRes.json();

    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(public_key)
    });

    await fetch('/webpush/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription })
    });
  } catch (e) {
    console.error('Web Push init error:', e);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

window.addEventListener('load', initWebPush);
</script>
