<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rifugio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: -apple-system, 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overscroll-behavior: none;
}
#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}
#view {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.tab-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 10px 0 max(16px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 0;
  background: none;
  border: none;
  font-family: inherit;
  text-decoration: none;
  color: var(--text-3);
  transition: color 0.15s;
}
.tab.active { color: var(--accent); }
.tab-icon { font-size: 20px; }
.tab-label { font-size: 10px; letter-spacing: 0.5px; }
.fade-enter {
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div class="tab-bar" id="tabBar">
    <button class="tab active" data-route="home">
      <div class="tab-icon">⌂</div><div class="tab-label">首頁</div>
    </button>
    <button class="tab" data-route="chatlist">
      <div class="tab-icon">✦</div><div class="tab-label">聊天</div>
    </button>
    <button class="tab" data-route="diary">
      <div class="tab-icon">✐</div><div class="tab-label">日記</div>
    </button>
    <button class="tab" data-route="persona">
      <div class="tab-icon">◎</div><div class="tab-label">人物書</div>
    </button>
    <button class="tab" data-route="theme">
      <div class="tab-icon">◐</div><div class="tab-label">主題</div>
    </button>
  </div>
</div>

<script src="/static/spa-router.js"></script>
<script src="/static/iframe-view-helper.js"></script>
<script src="/static/view-home.js"></script>
<script src="/static/view-chatlist.js"></script>
<script src="/static/view-chat.js"></script>
<script src="/static/view-space.js"></script>
<script src="/static/view-diary.js"></script>
<script src="/static/view-persona.js"></script>
<script src="/static/view-game.js"></script>
<script src="/static/view-usage.js"></script>
<script src="/static/view-theme.js"></script>
<script src="/static/stage-unlock.js"></script>
<script>
  RifugioRouter.init();
</script>

<script>
// 全域 fetch 攔截器，自動帶入 APP_SECRET
const APP_SECRET = '__APP_SECRET_PLACEHOLDER__';
const _origFetch = window.fetch.bind(window);
window.fetch = async function(input, init = {}) {
  const url = typeof input === 'string' ? input : input.url;
  // 只攔截自己的 API，不影響外部請求
  if (url.startsWith('/') && !url.startsWith('/static/') && !url.startsWith('/firebase-messaging-sw.js')) {
    init.headers = { ...(init.headers || {}), 'X-App-Secret': APP_SECRET };
  }
  return _origFetch(input, init);
};
</script>
<script src="/theme.js"></script>

<script>
async function initWebPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const keyRes = await fetch('/vapid_public_key');
    const { public_key } = await keyRes.json();

    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(public_key)
    });

    await fetch('/webpush/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription })
    });
  } catch (e) {
    console.error('Web Push init error:', e);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

window.addEventListener('load', initWebPush);
</script>
</body>
</html>
