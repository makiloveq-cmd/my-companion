<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rifugio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: -apple-system, 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overscroll-behavior: none;
}
#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}
#view {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.tab-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 10px 0 max(16px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 0;
  background: none;
  border: none;
  font-family: inherit;
  text-decoration: none;
  color: var(--text-3);
  transition: color 0.15s;
}
.tab.active { color: var(--accent); }
.tab-icon { font-size: 20px; }
.tab-label { font-size: 10px; letter-spacing: 0.5px; }
.fade-enter {
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div class="tab-bar" id="tabBar">
    <button class="tab active" data-route="home">
      <div class="tab-icon">⌂</div><div class="tab-label">首頁</div>
    </button>
    <button class="tab" data-route="chatlist">
      <div class="tab-icon">✦</div><div class="tab-label">聊天</div>
    </button>
    <button class="tab" data-route="moments">
      <div class="tab-icon">◎</div><div class="tab-label">朋友圈</div>
    </button>
    <button class="tab" data-route="diary">
      <div class="tab-icon">✐</div><div class="tab-label">日記</div>
    </button>
    <button class="tab" data-route="persona">
      <div class="tab-icon">⋯</div><div class="tab-label">人物書</div>
    </button>
  </div>
</div>

<script src="/static/spa-router.js"></script>
<script src="/static/iframe-view-helper.js"></script>
<script src="/static/view-home.js"></script>
<script src="/static/view-chatlist.js"></script>
<script src="/static/view-chat.js"></script>
<script src="/static/view-space.js"></script>
<script src="/static/view-diary.js"></script>
<script src="/static/view-persona.js"></script>
<script src="/static/view-usage.js"></script>
<script>
  RifugioRouter.init();

  // Firebase 推播通知初始化
  (async function() {
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyBRlnxEIZd8xarQVebBBCf4QewLGaO3vqI",
        authDomain: "rifugio-23142.firebaseapp.com",
        projectId: "rifugio-23142",
        storageBucket: "rifugio-23142.firebasestorage.app",
        messagingSenderId: "955776778929",
        appId: "1:955776778929:web:83720e2a7cb58b201bd890"
      };
      firebase.initializeApp(firebaseConfig);
      const messaging = firebase.messaging();

      // 註冊 Service Worker
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.register('/static/firebase-messaging-sw.js');
        messaging.useServiceWorker && messaging.useServiceWorker(reg);
      }

      // 請求推播權限
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        const token = await messaging.getToken({
          vapidKey: 'BB9Zdb1pQ038TEjcK27Gka43sHu3e2jfJWnJ1MqUOalYlt6AYPq86VV-_EMPy9ut3USHfvflU0ESl3WKs1hKdYg',
          serviceWorkerRegistration: await navigator.serviceWorker.ready
        });
        if (token) {
          await fetch('/fcm/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
        }
      }
    } catch(e) {
      console.log('推播初始化失敗:', e);
    }
  })();
</script>
<script src="/theme.js"></script>
</body>
</html>
