<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群聊 - Rifugio</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }
        .header {
            padding: 16px 20px;
            background: var(--surface);
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 18px; font-weight: 400; }
        .messages {
            flex: 1; overflow-y: auto;
            padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .message-row { display: flex; align-items: flex-end; gap: 10px; }
        .message-row.user { flex-direction: row-reverse; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500; flex-shrink: 0;
            user-select: none; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar.user { background: var(--accent); color: #fff; }
        .avatar.claude { background: var(--surface3); color: var(--text-2); }
        .avatar.gemini { background: var(--surface3); color: var(--text-2); opacity: 0.85; }
        .message-block { display: flex; flex-direction: column; gap: 4px; max-width: 70%; }
        .message-row.user .message-block { align-items: flex-end; }
        .message-name { font-size: 12px; color: var(--text-3); padding: 0 4px; }
        .message {
            padding: 12px 16px; border-radius: 16px;
            font-size: 15px; line-height: 1.6; white-space: pre-wrap;
        }
        .message.user {
            background: var(--bubble-user); color: #fff;
            border-radius: 16px 16px 4px 16px;
        }
        .message.bot {
            background: var(--bubble-ai); color: var(--text);
            border: 1px solid var(--border);
            border-radius: 16px 16px 16px 4px;
        }
        .message.has-img { padding: 0; background: transparent; border: none; }
        .message.has-img .chat-img {
            max-width: 200px; max-height: 260px;
            border-radius: 14px; display: block; cursor: pointer;
            border: 1px solid var(--border);
        }
        .message.has-img .img-caption {
            margin-top: 4px; padding: 8px 12px;
            font-size: 14px; line-height: 1.5;
        }
        .message-time {
            font-size: 11px; color: var(--text-3); padding: 0 4px;
        }

        /* 手動觸發列 */
        .reply-bar {
            padding: 8px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex; gap: 10px; justify-content: center;
        }
        .reply-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 16px;
            border: 1px solid var(--border);
            background: transparent; color: var(--text-2);
            border-radius: 20px; cursor: pointer; font-size: 13px;
        }
        .reply-btn:active { opacity: 0.7; }
        .reply-btn:disabled { opacity: 0.4; cursor: default; }
        .reply-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

        /* 輸入區 */
        .input-area { background: var(--surface); border-top: 1px solid var(--border); }

        /* 回應選擇器 */
        .reply-selector {
            display: flex; gap: 6px; padding: 8px 12px 0;
        }
        .reply-option {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; color: var(--text-3);
            cursor: pointer; padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            transition: all 0.15s;
            user-select: none;
        }
        .reply-option.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .reply-option input { display: none; }

        .image-preview-bar {
            display: none; align-items: center;
            gap: 10px; padding: 8px 16px 0;
        }
        .image-preview-bar.show { display: flex; }
        .preview-thumb { position: relative; width: 60px; height: 60px; }
        .preview-thumb img {
            width: 60px; height: 60px;
            object-fit: cover; border-radius: 10px;
            border: 1px solid var(--border);
        }
        .remove-img-btn {
            position: absolute; top: -6px; right: -6px;
            width: 18px; height: 18px;
            background: var(--text-2); color: var(--surface);
            border: none; border-radius: 50%; font-size: 10px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .input-row {
            display: flex; align-items: flex-end;
            padding: 8px 12px 12px; gap: 8px;
        }
        .toolbar-icon {
            width: 36px; height: 36px; flex-shrink: 0;
            background: transparent; border: none;
            color: var(--text-3); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: background 0.15s; padding: 0;
        }
        .toolbar-icon:hover { background: var(--surface2); }
        .toolbar-icon:active { opacity: 0.6; }
        .input-wrapper { position: relative; flex: 1; }
        .input-wrapper textarea {
            width: 100%; padding: 9px 14px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 22px; color: var(--text);
            font-size: 15px; outline: none; resize: none;
            font-family: inherit; max-height: 120px; line-height: 1.5;
        }
        .send-btn {
            width: 36px; height: 36px; flex-shrink: 0;
            background: var(--accent); border: none; border-radius: 50%;
            color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:active { opacity: 0.8; }
        .lightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.88); z-index: 200;
            align-items: center; justify-content: center;
        }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ 三人空間</h1>
    </div>
    <div class="messages" id="messages"></div>

    <!-- 手動觸發列 -->
    <div class="reply-bar">
        <button class="reply-btn" id="btn-claude-reply" onclick="triggerReply('claude')">
            <span class="dot"></span><span id="name-claude-btn">請晏說話</span>
        </button>
        <button class="reply-btn" id="btn-gemini-reply" onclick="triggerReply('gemini')">
            <span class="dot"></span><span id="name-gemini-btn">請熠說話</span>
        </button>
    </div>

    <div class="input-area">
        <!-- 回應選擇器 -->
        <div class="reply-selector">
            <label class="reply-option active" id="opt-both" onclick="setReplyMode('both')">
                <input type="radio" name="replyMode" value="both" checked> 兩個都回
            </label>
            <label class="reply-option" id="opt-claude" onclick="setReplyMode('claude')">
                <input type="radio" name="replyMode" value="claude"> 只有晏
            </label>
            <label class="reply-option" id="opt-gemini" onclick="setReplyMode('gemini')">
                <input type="radio" name="replyMode" value="gemini"> 只有熠
            </label>
        </div>
        <div class="image-preview-bar" id="imagePreviewBar">
            <div class="preview-thumb">
                <img id="imagePreviewThumb" src="" alt="">
                <button class="remove-img-btn" onclick="removeImage()">✕</button>
            </div>
        </div>
        <div class="input-row">
            <button class="toolbar-icon" onclick="document.getElementById('imageInput').click()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
            <div class="input-wrapper">
                <textarea id="input" placeholder="說點什麼…" rows="1"
                    onkeydown="handleKeydown(event)" oninput="autoGrow(this)"></textarea>
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="">
    </div>

    <script>
        let names = { user: '然然', claude: '晏', gemini: '熠' };
        let avatars = { user: null, claude: null, gemini: null };
        let pendingImageUrl = null;
        let replyMode = 'both';
        let isSending = false;

        function setReplyMode(mode) {
            replyMode = mode;
            document.querySelectorAll('.reply-option').forEach(el => el.classList.remove('active'));
            document.getElementById(`opt-${mode}`).classList.add('active');
        }

        function updateLabels() {
            const cn = names.claude || '晏';
            const gn = names.gemini || '熠';
            document.getElementById('name-claude-btn').textContent = `請${cn}說話`;
            document.getElementById('name-gemini-btn').textContent = `請${gn}說話`;
            document.getElementById('opt-claude').childNodes[1].textContent = ` 只有${cn}`;
            document.getElementById('opt-gemini').childNodes[1].textContent = ` 只有${gn}`;
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            const tw = new Date(d.getTime() + 8 * 60 * 60 * 1000);
            const nowTw = new Date(Date.now() + 8 * 60 * 60 * 1000);
            const isToday = tw.getUTCFullYear() === nowTw.getUTCFullYear()
                         && tw.getUTCMonth() === nowTw.getUTCMonth()
                         && tw.getUTCDate() === nowTw.getUTCDate();
            const hh = String(tw.getUTCHours()).padStart(2, '0');
            const mm = String(tw.getUTCMinutes()).padStart(2, '0');
            if (isToday) return `${hh}:${mm}`;
            return `${tw.getUTCMonth()+1}/${tw.getUTCDate()} ${hh}:${mm}`;
        }

        async function loadPersonas() {
            try {
                const res = await fetch('/personas');
                const data = await res.json();
                names.user = data.user?.name || names.user;
                names.claude = data.claude?.name || names.claude;
                names.gemini = data.gemini?.name || names.gemini;
                avatars.user = data.user?.avatar || null;
                avatars.claude = data.claude?.avatar || null;
                avatars.gemini = data.gemini?.avatar || null;
            } catch(e) {}
            updateLabels();
        }

        function makeAvatar(speaker) {
            const av = document.createElement('div');
            av.className = `avatar ${speaker}`;
            const src = avatars[speaker];
            if (src && src.startsWith('data:')) {
                const img = document.createElement('img');
                img.src = src;
                av.appendChild(img);
            } else {
                av.textContent = (names[speaker] || speaker)[0];
            }
            return av;
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('show');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
        }

        async function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('imagePreviewThumb').src = URL.createObjectURL(file);
            document.getElementById('imagePreviewBar').classList.add('show');
            pendingImageUrl = null;
            const formData = new FormData();
            formData.append('image', file);
            try {
                const res = await fetch('/upload_image', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.url) {
                    pendingImageUrl = data.url;
                } else {
                    alert('圖片上傳失敗');
                    removeImage();
                }
            } catch(err) {
                alert('圖片上傳失敗');
                removeImage();
            }
            e.target.value = '';
        }

        function removeImage() {
            pendingImageUrl = null;
            document.getElementById('imagePreviewBar').classList.remove('show');
            document.getElementById('imagePreviewThumb').src = '';
        }

        function addMessage(content, speaker, imageUrl, createdAt) {
            const row = document.createElement('div');
            const isUser = speaker === 'user';
            row.className = `message-row ${isUser ? 'user' : ''}`;

            const avatar = makeAvatar(speaker);
            const block = document.createElement('div');
            block.className = 'message-block';

            const nameEl = document.createElement('div');
            nameEl.className = 'message-name';
            nameEl.textContent = names[speaker] || speaker;

            const bubble = document.createElement('div');
            if (imageUrl) {
                bubble.className = `message ${isUser ? 'user' : 'bot'} has-img`;
                const img = document.createElement('img');
                img.className = 'chat-img';
                img.src = imageUrl;
                img.onclick = () => openLightbox(imageUrl);
                bubble.appendChild(img);
                if (content) {
                    const cap = document.createElement('div');
                    cap.className = 'img-caption';
                    cap.textContent = content;
                    bubble.appendChild(cap);
                }
            } else {
                bubble.className = `message ${isUser ? 'user' : 'bot'}`;
                bubble.textContent = content;
            }

            const timeEl = document.createElement('div');
            timeEl.className = 'message-time';
            timeEl.textContent = formatTime(createdAt || new Date().toISOString());

            block.appendChild(nameEl);
            block.appendChild(bubble);
            block.appendChild(timeEl);
            row.appendChild(avatar);
            row.appendChild(block);

            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
        }

        function addPending(speaker) {
            const row = document.createElement('div');
            row.className = 'message-row';
            const av = makeAvatar(speaker);
            const block = document.createElement('div');
            block.className = 'message-block';
            const bubble = document.createElement('div');
            bubble.className = 'message bot';
            bubble.style.opacity = '0.5';
            bubble.textContent = '…';
            block.appendChild(bubble);
            row.appendChild(av);
            row.appendChild(block);
            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
            return row;
        }

        async function loadMessages() {
            const res = await fetch('/group/messages');
            const data = await res.json();
            document.getElementById('messages').innerHTML = '';
            data.messages.forEach(m => addMessage(m.content, m.speaker, m.image_url, m.created_at));
        }

        function generateMessageId() {
            return 'gmsg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg && !pendingImageUrl) return;
            if (isSending) return;

            isSending = true;
            input.value = '';
            input.style.height = 'auto';

            const imageUrl = pendingImageUrl;
            removeImage();
            const sentAt = new Date().toISOString();
            addMessage(msg, 'user', imageUrl, sentAt);

            try {
                await fetch('/group/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: msg, message_id: generateMessageId(), image_url: imageUrl || null })
                });
            } catch(e) {}

            // 根據 replyMode 自動回應
            const speakers = replyMode === 'both' ? ['claude', 'gemini'] : [replyMode];
            const pendings = {};
            speakers.forEach(s => { pendings[s] = addPending(s); });

            await Promise.all(speakers.map(async s => {
                try {
                    const res = await fetch(`/group/reply/${s}`, { method: 'POST' });
                    const data = await res.json();
                    pendings[s].remove();
                    if (data.reply) {
                        addMessage(data.reply, s, null, new Date().toISOString());
                    } else {
                        addMessage('（連線失敗，請再試一次）', s, null, new Date().toISOString());
                    }
                } catch(e) {
                    pendings[s].remove();
                    addMessage('（連線失敗，請再試一次）', s, null, new Date().toISOString());
                }
            }));

            isSending = false;
        }

        async function triggerReply(botKey) {
            const btn = document.getElementById(`btn-${botKey}-reply`);
            btn.disabled = true;
            const pending = addPending(botKey);
            try {
                const res = await fetch(`/group/reply/${botKey}`, { method: 'POST' });
                const data = await res.json();
                pending.remove();
                if (data.error) {
                    addMessage('（連線失敗，請再試一次）', botKey, null, new Date().toISOString());
                } else {
                    addMessage(data.reply, botKey, null, new Date().toISOString());
                }
            } catch(e) {
                pending.remove();
                addMessage('（連線失敗，請再試一次）', botKey, null, new Date().toISOString());
            }
            btn.disabled = false;
        }

        async function init() {
            await loadPersonas();
            await loadMessages();
        }
        init();
    </script>
    <script src="/theme.js"></script>
</body>
</html>
