<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群聊 - Rifugio</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }
        .header {
            padding: 16px 20px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 18px; font-weight: 400; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .message-row.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
            user-select: none;
        }
        .avatar.user {
            background: var(--accent);
            color: #fff;
        }
        .avatar.claude {
            background: var(--surface3);
            color: var(--text-2);
        }
        .avatar.gemini {
            background: var(--surface3);
            color: var(--text-2);
            opacity: 0.85;
        }
        .message-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }
        .message-row.user .message-block {
            align-items: flex-end;
        }
        .message-name {
            font-size: 12px;
            color: var(--text-3);
            padding: 0 4px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .message.user {
            background: var(--bubble-user);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
        }
        .message.bot {
            background: var(--bubble-ai);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 16px 16px 16px 4px;
        }
        .reply-bar {
            padding: 10px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .reply-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-2);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .reply-btn:active { opacity: 0.7; }
        .reply-btn:disabled { opacity: 0.4; cursor: default; }
        .reply-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }
        .input-area {
            padding: 16px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            resize: none;
            font-family: inherit;
            max-height: 120px;
            line-height: 1.4;
        }
        .input-area button {
            padding: 12px 20px;
            background: var(--accent);
            border: none;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ 三人空間</h1>
    </div>
    <div class="messages" id="messages"></div>
    <div class="reply-bar">
        <button class="reply-btn" id="btn-claude-reply" onclick="triggerReply('claude')">
            <span class="dot"></span><span id="name-claude-btn">請晏說話</span>
        </button>
        <button class="reply-btn" id="btn-gemini-reply" onclick="triggerReply('gemini')">
            <span class="dot"></span><span id="name-gemini-btn">請熠說話</span>
        </button>
    </div>
    <div class="input-area">
        <textarea id="input" placeholder="說點什麼…" rows="1" onkeydown="handleKeydown(event)" oninput="autoGrow(this)"></textarea>
        <button onclick="sendMessage()">送出</button>
    </div>

    <script>
        let names = { user: '然然', claude: '晏', gemini: '熠' };

        async function loadNames() {
            try {
                const res = await fetch('/personas');
                const data = await res.json();
                names.user = data.user?.name || names.user;
                names.claude = data.claude?.name || names.claude;
                names.gemini = data.gemini?.name || names.gemini;
            } catch (e) {}
            document.getElementById('name-claude-btn').textContent = `請${names.claude}說話`;
            document.getElementById('name-gemini-btn').textContent = `請${names.gemini}說話`;
        }

        function addMessage(content, speaker) {
            const row = document.createElement('div');
            const isUser = speaker === 'user';
            row.className = `message-row ${isUser ? 'user' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${speaker}`;
            avatar.textContent = (names[speaker] || speaker)[0];

            const block = document.createElement('div');
            block.className = 'message-block';

            const name = document.createElement('div');
            name.className = 'message-name';
            name.textContent = names[speaker] || speaker;

            const bubble = document.createElement('div');
            bubble.className = `message ${isUser ? 'user' : 'bot'}`;
            bubble.textContent = content;

            block.appendChild(name);
            block.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(block);

            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
        }

        async function loadMessages() {
            const res = await fetch('/group/messages');
            const data = await res.json();
            const container = document.getElementById('messages');
            container.innerHTML = '';
            data.messages.forEach(m => addMessage(m.content, m.speaker));
        }

        function generateMessageId() {
            return 'gmsg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            input.style.height = 'auto';

            addMessage(msg, 'user');

            try {
                await fetch('/group/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: msg, message_id: generateMessageId() })
                });
            } catch (e) {}
        }

        async function triggerReply(botKey) {
            const btn = document.getElementById(`btn-${botKey}-reply`);
            btn.disabled = true;

            const pendingRow = document.createElement('div');
            pendingRow.className = 'message-row';
            pendingRow.innerHTML = `<div class="message-block"><div class="message bot" style="opacity:0.5;">…</div></div>`;
            document.getElementById('messages').appendChild(pendingRow);
            document.getElementById('messages').scrollTop = 999999;

            try {
                const res = await fetch(`/group/reply/${botKey}`, { method: 'POST' });
                const data = await res.json();
                pendingRow.remove();
                if (data.error) {
                    addMessage('（連線失敗，請再試一次）', botKey);
                } else {
                    addMessage(data.reply, botKey);
                }
            } catch (e) {
                pendingRow.remove();
                addMessage('（連線失敗，請再試一次）', botKey);
            }

            btn.disabled = false;
        }

        async function init() {
            await loadNames();
            await loadMessages();
        }

        init();
    </script>
    <script src="/theme.js"></script>
</body>
</html>
