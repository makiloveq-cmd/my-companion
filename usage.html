<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用量監控 - Rifugio</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }
        .header {
            padding: 14px 20px;
            background: var(--surface);
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
        }
        .header-back { font-size: 14px; color: var(--accent); cursor: pointer; padding: 4px 8px 4px 0; }
        .header h1 { font-size: 17px; font-weight: 400; flex: 1; }
        .currency-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .currency-label { font-size: 13px; color: var(--text-3); }
        .currency-toggle {
            display: flex; gap: 0;
            border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden;
        }
        .currency-btn {
            padding: 6px 14px; font-size: 13px;
            background: transparent; border: none;
            color: var(--text-2); cursor: pointer;
        }
        .currency-btn.active { background: var(--accent); color: #fff; }
        .rate-wrap {
            display: flex; align-items: center; gap: 6px; margin-left: auto;
        }
        .rate-label { font-size: 12px; color: var(--text-3); }
        .rate-input {
            width: 70px; padding: 5px 8px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text);
            font-size: 13px; outline: none; text-align: center;
        }
        .content { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .card-header {
            padding: 14px 16px 10px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border);
        }
        .card-icon {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .card-icon.anthropic { background: #d4a574; }
        .card-title { font-size: 15px; font-weight: 500; }
        .card-subtitle { font-size: 12px; color: var(--text-3); margin-top: 1px; }
        .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
        .balance-row { display: flex; align-items: baseline; gap: 6px; }
        .balance-amount { font-size: 32px; font-weight: 300; letter-spacing: -1px; }
        .balance-amount.warn { color: #e8a020; }
        .balance-amount.danger { color: #e05252; }
        .balance-unit { font-size: 14px; color: var(--text-3); }
        .progress-wrap { display: flex; flex-direction: column; gap: 4px; }
        .progress-label {
            display: flex; justify-content: space-between;
            font-size: 12px; color: var(--text-3);
        }
        .progress-bar {
            height: 6px; background: var(--surface2);
            border-radius: 3px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 3px;
            background: var(--accent); transition: width 0.4s ease;
        }
        .progress-fill.warn { background: #e8a020; }
        .progress-fill.danger { background: #e05252; }
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: .5px solid var(--border);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-size: 13px; color: var(--text-2); }
        .detail-val { font-size: 13px; font-weight: 500; }
        .budget-section { display: flex; flex-direction: column; gap: 6px; }
        .budget-row { display: flex; gap: 8px; align-items: center; }
        .budget-input {
            flex: 1; padding: 9px 12px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text);
            font-size: 14px; outline: none;
        }
        .budget-unit-toggle {
            display: flex; border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden;
        }
        .budget-unit-btn {
            padding: 9px 10px; font-size: 12px;
            background: transparent; border: none;
            color: var(--text-2); cursor: pointer;
        }
        .budget-unit-btn.active { background: var(--surface2); color: var(--text); font-weight: 500; }
        .budget-btn {
            padding: 9px 16px;
            background: var(--accent); border: none; border-radius: 10px;
            color: #fff; font-size: 14px; cursor: pointer;
        }
        .links-card { display: flex; flex-direction: column; }
        .ext-link {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: .5px solid var(--border);
            cursor: pointer; text-decoration: none; color: var(--text);
        }
        .ext-link:last-child { border-bottom: none; }
        .ext-link:active { background: var(--surface2); }
        .ext-link-left { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .ext-link-icon { font-size: 18px; }
        .ext-arrow { color: var(--text-3); font-size: 14px; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,.75); color: #fff;
            font-size: 13px; padding: 8px 18px; border-radius: 20px;
            opacity: 0; pointer-events: none; transition: opacity .25s;
            white-space: nowrap; z-index: 999;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-back" onclick="history.back()">‹ 返回</div>
        <h1>用量監控</h1>
    </div>

    <div class="currency-bar">
        <div class="currency-label">顯示單位</div>
        <div class="currency-toggle">
            <button class="currency-btn active" id="btn-usd" onclick="setCurrency('usd')">USD</button>
            <button class="currency-btn" id="btn-twd" onclick="setCurrency('twd')">TWD</button>
        </div>
        <div class="rate-wrap">
            <div class="rate-label">匯率 1 USD =</div>
            <input class="rate-input" type="number" id="rateInput" value="31.5" step="0.1" min="1" onchange="renderAll()">
            <div class="rate-label">TWD</div>
        </div>
    </div>

    <div class="content">

        <!-- 晏 Anthropic -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon anthropic">✦</div>
                <div>
                    <div class="card-title">晏（Anthropic）</div>
                    <div class="card-subtitle">claude-sonnet-4-5</div>
                </div>
            </div>
            <div class="card-body">
                <div>
                    <div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">預估剩餘</div>
                    <div class="balance-row">
                        <div class="balance-amount" id="a-remaining">—</div>
                        <div class="balance-unit" id="a-unit">USD</div>
                    </div>
                </div>
                <div class="progress-wrap">
                    <div class="progress-label">
                        <span>已使用</span>
                        <span id="a-pct">—</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="a-bar" style="width:0%"></div>
                    </div>
                </div>
                <div>
                    <div class="detail-row">
                        <div class="detail-label">儲值金額</div>
                        <div class="detail-val" id="a-budget">—</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">累計花費</div>
                        <div class="detail-val" id="a-cost">—</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Input tokens</div>
                        <div class="detail-val" id="a-in">—</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Output tokens</div>
                        <div class="detail-val" id="a-out">—</div>
                    </div>
                </div>
                <div class="budget-section">
                    <div style="font-size:12px;color:var(--text-3);">本次充值（累加）</div>
                    <div class="budget-row">
                        <input class="budget-input" type="number" id="a-budget-input" placeholder="金額" step="0.01" min="0">
                        <div class="budget-unit-toggle">
                            <button class="budget-unit-btn active" id="a-unit-usd" onclick="setBudgetUnit('a','usd')">USD</button>
                            <button class="budget-unit-btn" id="a-unit-twd" onclick="setBudgetUnit('a','twd')">TWD</button>
                        </div>
                        <button class="budget-btn" onclick="saveBudget()">新增</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 快捷連結 -->
        <div class="card links-card">
            <a class="ext-link" href="https://console.anthropic.com/settings/billing" target="_blank">
                <div class="ext-link-left">
                    <span class="ext-link-icon">✦</span>
                    <span>Anthropic Console 充值</span>
                </div>
                <span class="ext-arrow">›</span>
            </a>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currency = 'usd';
        let budgetUnit = 'usd';
        let rawData = null;

        function getRate() {
            return parseFloat(document.getElementById('rateInput').value) || 31.5;
        }

        function setCurrency(c) {
            currency = c;
            document.getElementById('btn-usd').classList.toggle('active', c === 'usd');
            document.getElementById('btn-twd').classList.toggle('active', c === 'twd');
            renderAll();
        }

        function setBudgetUnit(prefix, unit) {
            budgetUnit = unit;
            document.getElementById(`${prefix}-unit-usd`).classList.toggle('active', unit === 'usd');
            document.getElementById(`${prefix}-unit-twd`).classList.toggle('active', unit === 'twd');
        }

        function fmtMoney(usdVal) {
            if (currency === 'twd') return 'NT$' + (usdVal * getRate()).toFixed(0);
            return '$' + Number(usdVal).toFixed(4);
        }

        function fmtNum(n) { return Number(n).toLocaleString(); }

        function setCard(cost, budget) {
            const remaining = budget - cost;
            const pct = budget > 0 ? Math.min(100, (cost / budget) * 100) : 0;
            const cls = pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : '';

            const remainEl = document.getElementById('a-remaining');
            remainEl.textContent = fmtMoney(Math.max(0, remaining));
            remainEl.className = 'balance-amount' + (cls ? ' ' + cls : '');

            document.getElementById('a-unit').textContent = currency === 'twd' ? '' : 'USD';
            document.getElementById('a-pct').textContent = budget > 0 ? `${pct.toFixed(1)}%` : '—';

            const bar = document.getElementById('a-bar');
            bar.style.width = pct + '%';
            bar.className = 'progress-fill' + (cls ? ' ' + cls : '');

            document.getElementById('a-budget').textContent = fmtMoney(budget);
            document.getElementById('a-cost').textContent = fmtMoney(cost);
        }

        function renderAll() {
            if (!rawData) return;
            setCard(rawData.anthropic.cost_usd, rawData.anthropic.budget_usd);
        }

        async function loadUsage() {
            try {
                const res = await fetch('/usage');
                rawData = await res.json();
                document.getElementById('a-in').textContent = fmtNum(rawData.anthropic.input_tokens);
                document.getElementById('a-out').textContent = fmtNum(rawData.anthropic.output_tokens);
                renderAll();
            } catch(e) {
                console.error(e);
            }
        }

        async function saveBudget() {
            let val = parseFloat(document.getElementById('a-budget-input').value);
            if (isNaN(val) || val <= 0) { showToast('請輸入正確金額'); return; }
            if (budgetUnit === 'twd') val = val / getRate();

            try {
                await fetch('/usage/budget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anthropic_budget: val })
                });
                showToast('已新增');
                document.getElementById('a-budget-input').value = '';
                await loadUsage();
            } catch(e) {
                showToast('新增失敗');
            }
        }

        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        loadUsage();
    </script>
    <script src="/theme.js"></script>
</body>
</html>
