<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>人物書</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .ph {
      display: flex; align-items: center;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .ph-back { font-size: 14px; color: var(--accent); cursor: pointer; padding: 4px 8px 4px 0; }
    .ph-title { flex: 1; text-align: center; font-size: 16px; font-weight: 500; }
    .ph-save { font-size: 14px; color: var(--accent); cursor: pointer; padding: 4px 0 4px 8px; font-weight: 500; }

    .persona-switch {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .ps-btn {
      flex: 1; text-align: center;
      padding: 10px 0; font-size: 14px; color: var(--text-3);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .ps-btn.active { color: var(--accent); border-color: var(--accent); font-weight: 500; }

    .tab-bar {
      display: flex; overflow-x: auto;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-item {
      flex-shrink: 0; padding: 9px 18px;
      font-size: 13px; color: var(--text-3);
      cursor: pointer; border-bottom: 2px solid transparent;
      white-space: nowrap; transition: color .15s, border-color .15s;
    }
    .tab-item.active { color: var(--accent); border-color: var(--accent); }
    .tab-item.hidden { display: none; }

    .tab-body { flex: 1; overflow-y: auto; }
    .tab-panel { display: none; padding-bottom: 40px; }
    .tab-panel.active { display: block; }

    .sec-label {
      font-size: 11px; font-weight: 600; letter-spacing: .08em;
      color: var(--text-3); text-transform: uppercase;
      padding: 18px 16px 6px;
    }
    .form-group {
      background: var(--surface);
      border-top: .5px solid var(--border);
      border-bottom: .5px solid var(--border);
    }
    .form-row {
      padding: 12px 16px;
      border-bottom: .5px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .form-row:last-child { border-bottom: none; }
    .form-label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 5px; }
    .form-input {
      width: 100%; background: transparent;
      border: none; outline: none;
      font-size: 15px; color: var(--text);
      font-family: inherit; line-height: 1.5; resize: none;
    }
    .form-input::placeholder { color: var(--text-3); }
    textarea.form-input { min-height: 60px; }

    .readonly-text {
      font-size: 14px; color: var(--text); line-height: 1.7;
      white-space: pre-wrap; min-height: 40px;
    }
    .readonly-hint {
      font-size: 11px; color: var(--text-3); margin-top: 4px;
    }

    .av-hero {
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px 8px;
    }
    .av-circle {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--surface2); border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden; position: relative; font-size: 40px;
    }
    .av-circle img { width: 100%; height: 100%; object-fit: cover; }
    .av-edit {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s;
    }
    .av-circle:hover .av-edit { opacity: 1; }
    .av-edit svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .av-hint { font-size: 12px; color: var(--text-3); margin-top: 8px; }

    .opt-group { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
    .opt-btn {
      padding: 6px 14px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border);
      font-size: 13px; color: var(--text-2);
      cursor: pointer; transition: background .12s, color .12s, border-color .12s;
      user-select: none;
    }
    .opt-btn.sel { background: var(--accent); color: #fff; border-color: var(--accent); }

    .perspective-card {
      background: var(--surface);
      border-top: .5px solid var(--border);
      border-bottom: .5px solid var(--border);
      margin-bottom: 8px;
    }
    .perspective-header {
      padding: 14px 16px 6px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .perspective-title { font-size: 14px; font-weight: 500; }
    .perspective-refresh {
      font-size: 12px; color: var(--accent);
      cursor: pointer; padding: 4px 8px;
      border: 1px solid var(--accent);
      border-radius: 12px;
    }
    .perspective-refresh:disabled { opacity: 0.4; pointer-events: none; }
    .perspective-body {
      padding: 8px 16px 14px;
      font-size: 14px; line-height: 1.8;
      color: var(--text); white-space: pre-wrap;
      min-height: 60px;
    }
    .perspective-body.loading { color: var(--text-3); font-style: italic; }
    .perspective-time {
      padding: 0 16px 10px;
      font-size: 11px; color: var(--text-3);
    }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #fff;
      font-size: 13px; padding: 8px 18px; border-radius: 20px;
      opacity: 0; pointer-events: none; transition: opacity .25s;
      white-space: nowrap; z-index: 999;
    }
    .toast.show { opacity: 1; }

    .header, .ph {
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .input-area, .tab-bar, .reply-bar {
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>

  <div class="ph">
    <div class="ph-title">人物書</div>
    <div class="ph-save" id="saveBtn" onclick="savePersona()">儲存</div>
  </div>

  <div class="persona-switch">
    <div class="ps-btn active" id="ps-claude" onclick="switchPersona('claude')">晏</div>
    <div class="ps-btn" id="ps-user" onclick="switchPersona('user')">然然</div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab(0)">基本資訊</div>
    <div class="tab-item" onclick="switchTab(1)">個性背景</div>
    <div class="tab-item" id="tab-relation" onclick="switchTab(2)">關係設定</div>
    <div class="tab-item" id="tab-advanced" onclick="switchTab(3)">進階設定</div>
    <div class="tab-item hidden" id="tab-perspective" onclick="switchTab(4)">我的視角</div>
  </div>

  <input type="file" id="avInput" accept="image/*" style="display:none" onchange="onAvChange(event)">

  <div class="tab-body">

    <!-- Tab 0: 基本資訊 -->
    <div class="tab-panel active" id="tp0">
      <div class="av-hero">
        <div class="av-circle" onclick="document.getElementById('avInput').click()">
          <span id="avEmoji">🌸</span>
          <img id="avImg" src="" style="display:none">
          <div class="av-edit"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
        </div>
        <div class="av-hint">點擊更換頭像</div>
      </div>

      <div class="sec-label">基本資訊</div>
      <div class="form-group">
        <div class="form-row">
          <div class="form-label">名字 <span class="badge">必填</span></div>
          <input class="form-input" type="text" id="f-name" placeholder="例：晏、然然…">
        </div>
        <div class="form-row">
          <div class="form-label">職業 / 身份</div>
          <input class="form-input" type="text" id="f-job" placeholder="例：研究生、攝影師…">
        </div>
      </div>

      <div class="sec-label">外觀</div>
      <div class="form-group">
        <div class="form-row">
          <div class="form-label">外觀描述</div>
          <textarea class="form-input" id="f-appearance" rows="3" placeholder="膚色、髮型、眼神、身形特徵…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-label">衣著穿搭風格</div>
          <textarea class="form-input" id="f-outfit" rows="2" placeholder="常見穿搭、色系偏好、細節…"></textarea>
        </div>
      </div>
    </div>

    <!-- Tab 1: 個性背景 -->
    <div class="tab-panel" id="tp1">
      <div class="sec-label">個性</div>
      <div class="form-group">
        <div class="form-row">
          <div class="form-label">個性描述 <span class="badge">必填</span></div>
          <textarea class="form-input" id="f-persona" rows="5" placeholder="描述他的性格…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-label">性格標籤 <span id="tagCount" style="font-size:11px;color:var(--text-3)">（最多5個）</span></div>
          <div class="opt-group" id="tagGroup"></div>
        </div>
      </div>

      <div class="sec-label">喜好</div>
      <div class="form-group">
        <div class="form-row">
          <div class="form-label">喜好與興趣</div>
          <textarea class="form-input" id="f-hobby" rows="2" placeholder="例：深夜騎車、黑膠唱片…"></textarea>
        </div>
      </div>
    </div>

    <!-- Tab 2: 關係設定 -->
    <div class="tab-panel" id="tp2">
      <div class="sec-label">與你的關係</div>
      <div class="form-group">
        <div class="form-row">
          <div class="form-label">關係類型</div>
          <div class="opt-group" id="relationGroup"></div>
        </div>
        <div class="form-row" id="rel-bg-row">
          <div class="form-label">關係背景</div>
          <div id="rel-bg-readonly" style="display:none">
            <div class="readonly-text" id="rel-bg-display">（尚未生成，累積對話後會自動更新）</div>
            <div class="readonly-hint">由系統根據對話自動更新，不可手動編輯</div>
          </div>
          <textarea class="form-input" id="f-rel_bg" rows="4" placeholder="你們是怎麼認識的、相處的故事…"></textarea>
        </div>
      </div>
    </div>

    <!-- Tab 3: 進階設定 -->
    <div class="tab-panel" id="tp3">
      <div class="sec-label">限制</div>
      <div class="form-group">
        <div class="form-row">
          <div class="form-label">禁止話題</div>
          <textarea class="form-input" id="f-taboo" rows="2" placeholder="不希望角色提及或深入的話題…"></textarea>
        </div>
      </div>
      <div class="sec-label">補充</div>
      <div class="form-group">
        <div class="form-row">
          <div class="form-label">補充指令</div>
          <textarea class="form-input" id="f-extra" rows="4" placeholder="其他特殊設定或行為指令…"></textarea>
        </div>
      </div>
    </div>

    <!-- Tab 4: 我的視角（只有然然看到）-->
    <div class="tab-panel" id="tp4">
      <div class="sec-label">晏對然然的內心想法</div>

      <div class="perspective-card">
        <div class="perspective-header">
          <div class="perspective-title" id="title-claude">晏眼中的然然</div>
          <button class="perspective-refresh" id="refresh-claude" onclick="refreshPerspective()">重新分析</button>
        </div>
        <div class="perspective-body loading" id="body-claude">載入中…</div>
        <div class="perspective-time" id="time-claude"></div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const TAGS = ['傲嬌','溫柔','冷靜','話少','活潑','體貼','霸道','純情','成熟','幽默','神秘','認真','撒嬌','腹黑','直率','細膩','溫暖','理性'];
    const RELATIONS = [
      { v: 'lover', l: '戀人' },
      { v: 'childhood', l: '青梅竹馬' },
      { v: 'friend', l: '好友' },
      { v: 'online', l: '網友' },
      { v: 'colleague', l: '同事' },
      { v: 'stranger', l: '陌生人' },
    ];

    let currentPersona = 'claude';
    let allData = {};
    let selectedTags = [];

    function buildTags() {
      const g = document.getElementById('tagGroup');
      g.innerHTML = '';
      TAGS.forEach(t => {
        const b = document.createElement('div');
        b.className = 'opt-btn';
        b.textContent = t;
        b.dataset.val = t;
        b.onclick = () => {
          if (b.classList.contains('sel')) {
            b.classList.remove('sel');
            selectedTags = selectedTags.filter(x => x !== t);
          } else if (selectedTags.length < 5) {
            b.classList.add('sel');
            selectedTags.push(t);
          } else {
            showToast('最多選 5 個標籤');
          }
          updateTagCount();
        };
        g.appendChild(b);
      });
    }

    function buildRelations() {
      const g = document.getElementById('relationGroup');
      g.innerHTML = '';
      RELATIONS.forEach(o => {
        const b = document.createElement('div');
        b.className = 'opt-btn';
        b.textContent = o.l;
        b.dataset.val = o.v;
        b.onclick = () => {
          g.querySelectorAll('.opt-btn').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
        };
        g.appendChild(b);
      });
    }

    function updateTagCount() {
      document.getElementById('tagCount').textContent = `（已選 ${selectedTags.length} / 最多 5 個）`;
    }

    function setRelation(val) {
      document.querySelectorAll('#relationGroup .opt-btn').forEach(b => {
        b.classList.toggle('sel', b.dataset.val === val);
      });
    }

    function getRelation() {
      const sel = document.querySelector('#relationGroup .opt-btn.sel');
      return sel ? sel.dataset.val : '';
    }

    function onAvChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 200;
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const s = Math.min(img.width, img.height);
          const ox = (img.width - s) / 2, oy = (img.height - s) / 2;
          ctx.drawImage(img, ox, oy, s, s, 0, 0, size, size);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          showAvatar(dataUrl);
          allData[currentPersona] = allData[currentPersona] || {};
          allData[currentPersona].avatar = dataUrl;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function showAvatar(src) {
      const avImg = document.getElementById('avImg');
      const avEmoji = document.getElementById('avEmoji');
      if (src && src.startsWith('data:')) {
        avImg.src = src;
        avImg.style.display = 'block';
        avEmoji.style.display = 'none';
      } else {
        avImg.style.display = 'none';
        avEmoji.style.display = 'block';
        avEmoji.textContent = src || '🌸';
      }
    }

    let curTab = 0;
    function switchTab(n) {
      document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', i === n));
      document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === n));
      curTab = n;
      if (n === 4) loadPerspective();
    }

    function applyUserMode(isUser) {
      document.getElementById('tab-relation').classList.toggle('hidden', isUser);
      document.getElementById('tab-advanced').classList.toggle('hidden', isUser);
      document.getElementById('tab-perspective').classList.toggle('hidden', !isUser);
      const readonly = document.getElementById('rel-bg-readonly');
      const editable = document.getElementById('f-rel_bg');
      if (!isUser) {
        readonly.style.display = 'block';
        editable.style.display = 'none';
        const relBg = allData[currentPersona]?.rel_bg || '';
        document.getElementById('rel-bg-display').textContent = relBg || '（尚未生成，累積對話後會自動更新）';
      } else {
        readonly.style.display = 'none';
        editable.style.display = 'block';
      }
      if (isUser && curTab > 1) switchTab(0);
    }

    function switchPersona(key) {
      saveCurrentToCache();
      currentPersona = key;
      document.querySelectorAll('.ps-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`ps-${key}`).classList.add('active');
      loadCurrentFromCache();
      applyUserMode(key === 'user');
    }

    const TEXT_FIELDS = ['name','job','appearance','outfit','persona','hobby','rel_bg','taboo','extra'];

    function saveCurrentToCache() {
      const d = allData[currentPersona] || {};
      TEXT_FIELDS.forEach(f => {
        const el = document.getElementById(`f-${f}`);
        if (el) d[f] = el.value;
      });
      d.tags = selectedTags.join(',');
      d.relation = getRelation();
      allData[currentPersona] = d;
    }

    function loadCurrentFromCache() {
      const d = allData[currentPersona] || {};
      TEXT_FIELDS.forEach(f => {
        const el = document.getElementById(`f-${f}`);
        if (el) el.value = d[f] || '';
      });
      showAvatar(d.avatar || '🌸');
      selectedTags = d.tags ? d.tags.split(',').filter(Boolean) : [];
      document.querySelectorAll('#tagGroup .opt-btn').forEach(b => {
        b.classList.toggle('sel', selectedTags.includes(b.dataset.val));
      });
      updateTagCount();
      setRelation(d.relation || '');
    }

    async function savePersona() {
      saveCurrentToCache();
      const d = allData[currentPersona];
      if (!d.name || !d.name.trim()) { showToast('請填寫名字'); return; }
      try {
        await fetch(`/personas/${currentPersona}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(d)
        });
        showToast('已儲存');
      } catch(e) {
        showToast('儲存失敗');
      }
    }

    // ===== 我的視角 =====

    function formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 更新`;
    }

    async function loadPerspective() {
      const claudeName = allData.claude?.name || '晏';
      const userName = allData.user?.name || '然然';
      document.getElementById('title-claude').textContent = `${claudeName}眼中的${userName}`;

      try {
        const res = await fetch('/perspective');
        const data = await res.json();
        const body = document.getElementById('body-claude');
        const time = document.getElementById('time-claude');
        if (data.claude?.content) {
          body.textContent = data.claude.content;
          body.classList.remove('loading');
          time.textContent = formatTime(data.claude.updated_at);
        } else {
          body.textContent = '尚未生成，點右上角重新分析。';
          body.classList.add('loading');
        }
      } catch(e) {
        document.getElementById('body-claude').textContent = '載入失敗';
      }
    }

    async function refreshPerspective() {
      const btn = document.getElementById('refresh-claude');
      btn.disabled = true;
      btn.textContent = '分析中…';
      const body = document.getElementById('body-claude');
      body.textContent = '分析中，請稍候…';
      body.classList.add('loading');
      try {
        const res = await fetch('/perspective/claude', { method: 'POST' });
        const data = await res.json();
        if (data.content) {
          body.textContent = data.content;
          body.classList.remove('loading');
          document.getElementById('time-claude').textContent = formatTime(new Date().toISOString());
        } else {
          body.textContent = '分析失敗，請稍後再試。';
        }
      } catch(e) {
        body.textContent = '分析失敗，請稍後再試。';
      }
      btn.disabled = false;
      btn.textContent = '重新分析';
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    async function init() {
      buildTags();
      buildRelations();
      try {
        const res = await fetch('/personas');
        const data = await res.json();
        allData = data;
      } catch(e) {}
      const cn = allData.claude?.name || '晏';
      const un = allData.user?.name || '然然';
      document.getElementById('ps-claude').textContent = cn;
      document.getElementById('ps-user').textContent = un;
      loadCurrentFromCache();
      applyUserMode(false);
    }

    init();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
