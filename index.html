<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的陪伴空間</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px 20px;
            background: #16213e;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 { font-size: 18px; font-weight: 400; }
        .ai-switch {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .ai-btn {
            padding: 6px 14px;
            border: 1px solid #0f3460;
            background: transparent;
            color: #aaa;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .ai-btn.active {
            background: #0f3460;
            color: #fff;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .message-row.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .avatar.user {
            background: #3a5a8a;
            color: #fff;
        }
        .avatar.ai {
            background: #2a3a5a;
            color: #ccc;
        }
        .message-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }
        .message-row.user .message-block {
            align-items: flex-end;
        }
        .message-name {
            font-size: 12px;
            color: #888;
            padding: 0 4px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
        }
        .message.user {
            background: #0f3460;
            border-radius: 16px 16px 4px 16px;
        }
        .message.ai {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 16px 16px 16px 4px;
        }
        .input-area {
            padding: 16px 20px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 24px;
            color: #eee;
            font-size: 15px;
            outline: none;
        }
        .input-area button {
            padding: 12px 20px;
            background: #0f3460;
            border: none;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ 我的陪伴空間</h1>
        <div class="ai-switch">
            <button class="ai-btn active" onclick="switchAI('claude', event)">晏</button>
            <button class="ai-btn" onclick="switchAI('gemini', event)">Gemini</button>
        </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="說點什麼…" onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">送出</button>
    </div>

    <script>
        let currentAI = 'claude';
        let aiName = '晏';

        async function loadHistory() {
            const messages = document.getElementById('messages');
            messages.innerHTML = '';
            try {
                const res = await fetch(`/history/${currentAI}`);
                const data = await res.json();
                data.history.forEach(m => {
                    const role = m.role === 'user' ? 'user' : 'ai';
                    addMessage(m.content, role);
                });
            } catch (e) {}
        }

        function switchAI(ai, e) {
            currentAI = ai;
            aiName = ai === 'claude' ? '晏' : 'Gemini';
            document.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            loadHistory();
        }

        function addMessage(text, role) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.textContent = role === 'user' ? '然' : aiName[0];

            const block = document.createElement('div');
            block.className = 'message-block';

            const name = document.createElement('div');
            name.className = 'message-name';
            name.textContent = role === 'user' ? '然然' : aiName;

            const bubble = document.createElement('div');
            bubble.className = `message ${role}`;
            bubble.textContent = text;

            block.appendChild(name);
            block.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(block);

            document.getElementById('messages').appendChild(row);
            document.getElementById('messages').scrollTop = 999999;
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';

            addMessage(msg, 'user');

            try {
                const res = await fetch(`/chat/${currentAI}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                addMessage(data.reply, 'ai');
            } catch (e) {
                addMessage('連線失敗，請確認伺服器是否啟動。', 'ai');
            }
        }

        loadHistory();
    </script>
</body>
</html>
