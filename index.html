<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的陪伴空間</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px 20px;
            background: #16213e;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 { font-size: 18px; font-weight: 400; }
        .ai-switch {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .ai-btn {
            padding: 6px 14px;
            border: 1px solid #0f3460;
            background: transparent;
            color: #aaa;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .ai-btn.active {
            background: #0f3460;
            color: #fff;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
        }
        .message.user {
            align-self: flex-end;
            background: #0f3460;
        }
        .message.ai {
            align-self: flex-start;
            background: #16213e;
            border: 1px solid #0f3460;
        }
        .input-area {
            padding: 16px 20px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 24px;
            color: #eee;
            font-size: 15px;
            outline: none;
        }
        .input-area button {
            padding: 12px 20px;
            background: #0f3460;
            border: none;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
        .settings {
            padding: 12px 20px;
            background: #0d0d1a;
            border-bottom: 1px solid #0f3460;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings input {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #eee;
            font-size: 13px;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ 我的陪伴空間</h1>
        <div class="ai-switch">
            <button class="ai-btn active" onclick="switchAI('claude')">晏</button>
            <button class="ai-btn" onclick="switchAI('gemini')">Gemini</button>
        </div>
    </div>
    <div class="settings">
        <input type="password" id="claude-key" placeholder="Claude API Key">
        <input type="password" id="gemini-key" placeholder="Gemini API Key">
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="說點什麼…" onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">送出</button>
    </div>

    <script>
       let currentAI = 'claude';

async function loadHistory() {
    const messages = document.getElementById('messages');
    messages.innerHTML = '';
    try {
        const res = await fetch(`/history/${currentAI}`);
        const data = await res.json();
        data.history.forEach(m => {
            const role = m.role === 'user' ? 'user' : 'ai';
            addMessage(m.content, role);
        });
    } catch (e) {}
}

function switchAI(ai) {
    currentAI = ai;
    document.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadHistory();
}

function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 999999;
}

async function sendMessage() {
    const input = document.getElementById('input');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';

    addMessage(msg, 'user');

    const apiKey = currentAI === 'claude'
        ? document.getElementById('claude-key').value
        : document.getElementById('gemini-key').value;

    try {
        const res = await fetch(`/chat/${currentAI}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, api_key: apiKey })
        });
        const data = await res.json();
        addMessage(data.reply, 'ai');
    } catch (e) {
        addMessage('連線失敗，請確認伺服器是否啟動。', 'ai');
    }
}

loadHistory();
    </script>
</body>
</html>
