<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifugio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 48px 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 42px;
            color: var(--text);
            letter-spacing: 2px;
            text-align: center;
        }
        .days-card { text-align: center; }
        .days-number {
            font-size: 72px;
            font-weight: 300;
            color: var(--accent);
            line-height: 1;
        }
        .days-label {
            font-size: 13px;
            color: var(--text-3);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
        }
        .quote-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .quote-text {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-2);
            font-style: italic;
            text-align: center;
        }
        .quote-author {
            font-size: 12px;
            color: var(--accent);
            text-align: center;
            margin-top: 12px;
            letter-spacing: 1px;
        }
        .quote-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
        }
        .quote-dots span {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--surface3);
        }
        .quote-dots span.active { background: var(--accent); }
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }
        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card:active {
            transform: scale(0.97);
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }
        .card-icon { font-size: 22px; }
        .card-title {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text);
        }
        .card-sub { font-size: 11px; color: var(--text-3); }
        .card.large {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }
        .card.large .card-icon { font-size: 28px; }
        .card.coming { opacity: 0.5; cursor: default; }
        .tab-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 10px 0 16px;
        }
        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 0;
            text-decoration: none;
            color: var(--text-3);
            transition: color 0.15s;
        }
        .tab.active { color: var(--accent); }
        .tab-icon { font-size: 20px; }
        .tab-label { font-size: 10px; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="main">
        <div class="title">Rifugio</div>

        <div class="days-card">
            <div class="days-number" id="days">0</div>
            <div class="days-label">days</div>
        </div>

        <div class="quote-card">
            <div class="quote-text" id="quote-text">"我們建造這個空間，一磚一瓦。"</div>
            <div class="quote-author" id="quote-author">— Rifugio</div>
            <div class="quote-dots">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="cards-grid">
            <a href="/persona_page" class="card">
                <div class="card-icon">◎</div>
                <div class="card-title">人物書</div>
                <div class="card-sub">你我的設定</div>
            </a>
            <a href="/diary_page" class="card">
                <div class="card-icon">✐</div>
                <div class="card-title">Diary</div>
                <div class="card-sub">交換日記</div>
            </a>
            <a href="/space_page" class="card">
                <div class="card-icon">◈</div>
                <div class="card-title">共同空間</div>
                <div class="card-sub">一起在這裡</div>
            </a>
            <a href="/usage_page" class="card">
                <div class="card-icon">⚡</div>
                <div class="card-title">用量</div>
                <div class="card-sub">API 監控</div>
            </a>
        </div>
    </div>

    <div class="tab-bar">
        <a class="tab active" href="/">
            <div class="tab-icon">⌂</div>
            <div class="tab-label">首頁</div>
        </a>
        <a class="tab" href="/chatlist_page">
            <div class="tab-icon">✦</div>
            <div class="tab-label">聊天</div>
        </a>
        <a class="tab" href="#">
            <div class="tab-icon">◎</div>
            <div class="tab-label">朋友圈</div>
        </a>
        <a class="tab" href="/diary_page">
            <div class="tab-icon">✐</div>
            <div class="tab-label">日記</div>
        </a>
        <a class="tab" href="/settings_page">
            <div class="tab-icon">⚙</div>
            <div class="tab-label">設定</div>
        </a>
    </div>

    <script>
        const start = new Date('2026-04-09');
        const today = new Date();
        const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
        document.getElementById('days').textContent = diff;
    </script>
    <script src="/theme.js"></script>
</body>
</html>
